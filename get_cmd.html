<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعدي الذكي - GitHub Edition</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 500px; height: 90vh; background: white; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .header { background: #10a37f; color: white; padding: 20px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 18px; border-radius: 15px; max-width: 80%; word-wrap: break-word; line-height: 1.5; }
        .user-msg { background: #10a37f; color: white; align-self: flex-start; border-bottom-right-radius: 2px; }
        .bot-msg { background: #f7f7f8; color: #333; align-self: flex-end; border: 1px solid #e5e5e5; border-bottom-left-radius: 2px; }
        .input-area { padding: 20px; border-top: 1px solid #eee; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        button { background: #10a37f; color: white; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">مساعد الذكاء الاصطناعي</div>
    <div id="chat-box">
        <div class="message bot-msg">أهلاً بك! الموقع الآن يعمل من السيرفر بنجاح. كيف يمكنني مساعدتك؟</div>
    </div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="اكتب سؤالك هنا..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button id="send-btn" onclick="sendMessage()">إرسال</button>
    </div>
</div>

<script>
    // مفتاح OpenRouter الخاص بك
    const API_KEY = "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";

    async function sendMessage() {
        const inputField = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatBox = document.getElementById('chat-box');
        const message = inputField.value.trim();

        if (!message) return;

        // تعطيل الزر وإضافة رسالة المستخدم
        inputField.value = '';
        sendBtn.disabled = true;
        chatBox.innerHTML += `<div class="message user-msg">${message}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${API_KEY}`,
                    "Content-Type": "application/json",
                    "HTTP-Referer": window.location.origin, // سيأخذ رابط موقعك على GitHub تلقائياً
                    "X-Title": "My GitHub AI Bot"
                },
                body: JSON.stringify({
                    "model": "meta-llama/llama-3-8b-instruct:free",
                    "messages": [{ "role": "user", "content": message }]
                })
            });

            const data = await response.json();
            
            if (data.choices && data.choices[0].message) {
                const botReply = data.choices[0].message.content;
                chatBox.innerHTML += `<div class="message bot-msg">${botReply}</div>`;
            } else {
                throw new Error("رد غير صالح");
            }

        } catch (error) {
            console.error("Error:", error);
            chatBox.innerHTML += `<div class="message bot-msg" style="color: red;">عذراً، حدث خطأ أثناء الاتصال بالخادم.</div>`;
        } finally {
            sendBtn.disabled = false;
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    }
</script>

</body>
</html>
