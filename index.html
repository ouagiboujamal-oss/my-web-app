<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قصص الرعب المرعبة</title>
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6847506129570052"
     crossorigin="anonymous"></script>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000000;
            color: #fff;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(139, 0, 0, 0.3) 1px, transparent 1px),
                radial-gradient(circle at 80% 80%, rgba(0, 0, 0, 0.5) 2px, transparent 2px),
                linear-gradient(135deg, #0a0a0a 0%, #1a0000 25%, #0a0a0a 50%, #1a0000 75%, #0a0a0a 100%);
            background-size: 100px 100px, 150px 150px, 200% 200%;
            animation: backgroundMove 20s ease infinite;
        }

        @keyframes backgroundMove {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 100px 100px, 150px 150px, -200% -200%; }
        }

        /* تأثيرات مرعبة */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.3) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* شاشة تسجيل الدخول */
        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000000, #1a0000);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(10px);
        }

        .login-screen.hidden {
            display: none;
        }

        .login-container {
            background: linear-gradient(135deg, rgba(26, 0, 0, 0.9), rgba(51, 0, 0, 0.9));
            padding: 60px 40px;
            border-radius: 20px;
            border: 3px solid #8b0000;
            text-align: center;
            box-shadow: 0 0 50px rgba(139, 0, 0, 0.9), inset 0 0 30px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 90%;
            backdrop-filter: blur(10px);
        }

        .login-container h1 {
            font-size: 48px;
            color: #ff4444;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #8b0000, 0 0 40px #ff0000;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px #8b0000, 0 0 40px #ff0000; }
            50% { text-shadow: 0 0 30px #ff0000, 0 0 60px #ff4444; }
        }

        .login-container p {
            color: #cccccc;
            margin-bottom: 40px;
            font-size: 16px;
        }

        /* الشريط العلوي */
        header {
            background: linear-gradient(135deg, rgba(26, 0, 0, 0.95), rgba(51, 0, 0, 0.95));
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #8b0000;
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 100;
        }

        header h1 {
            font-size: 48px;
            color: #ff4444;
            text-shadow: 0 0 20px #8b0000;
            flex: 1;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(139, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid #ff4444;
            backdrop-filter: blur(10px);
        }

        .user-profile img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #ff4444;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
        }

        .user-info {
            text-align: right;
        }

        .user-info .name {
            color: #ff4444;
            font-weight: bold;
            font-size: 14px;
        }

        .user-info .email {
            color: #cccccc;
            font-size: 12px;
        }

        .logout-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #ff6666;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
        }

        /* زر القائمة للموبايل */
        .menu-toggle {
            display: none;
            background: #ff4444;
            border: none;
            color: white;
            font-size: 24px;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
        }

        /* القائمة الجانبية */
        .sidebar {
            position: fixed;
            left: 0;
            top: 80px;
            width: 280px;
            height: calc(100vh - 80px);
            background: linear-gradient(180deg, rgba(26, 26, 26, 0.95), rgba(45, 45, 45, 0.95));
            padding: 20px;
            border-right: 2px solid #8b0000;
            overflow-y: auto;
            z-index: 1000;
            backdrop-filter: blur(10px);
            box-shadow: inset -20px 0 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .sidebar::-webkit-scrollbar {
            width: 8px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: rgba(139, 0, 0, 0.1);
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #ff4444;
            border-radius: 4px;
        }

        .sidebar h2 {
            color: #ff4444;
            margin-bottom: 20px;
            border-bottom: 2px solid #8b0000;
            padding-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
        }

        .story-list {
            list-style: none;
        }

        .story-list li {
            padding: 12px;
            margin: 10px 0;
            background: rgba(139, 0, 0, 0.2);
            border-left: 3px solid #ff4444;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
            font-size: 14px;
        }

        .story-list li:hover {
            background: rgba(139, 0, 0, 0.5);
            transform: translateX(-5px);
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.3);
        }

        .story-list li.active {
            background: rgba(255, 68, 68, 0.3);
            border-left: 5px solid #ff4444;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.5);
        }

        /* المحتوى الرئيسي */
        .container {
            margin-left: 280px;
            margin-top: 80px;
            padding: 40px;
            min-height: 100vh;
            position: relative;
            z-index: 10;
        }

        .story {
            display: none;
            animation: fadeIn 0.5s;
        }

        .story.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .story-controls {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .story-btn {
            background: linear-gradient(135deg, #ff4444, #ff6666);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.3);
        }

        .story-btn:hover {
            background: linear-gradient(135deg, #ff6666, #ff8888);
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.6);
            transform: translateY(-2px);
        }

        .story-btn.active {
            background: linear-gradient(135deg, #00ff00, #00dd00);
            color: black;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
        }

        .story-title {
            font-size: 36px;
            color: #ff4444;
            text-shadow: 0 0 20px #8b0000;
            margin: 30px 0 20px 0;
            border-bottom: 2px solid #8b0000;
            padding-bottom: 15px;
        }

        .story-text {
            font-size: 18px;
            line-height: 1.8;
            color: #e0e0e0;
            margin: 20px 0;
            background: linear-gradient(135deg, rgba(26, 26, 26, 0.9), rgba(20, 20, 20, 0.9));
            padding: 25px;
            border-left: 4px solid #ff4444;
            border-radius: 5px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .story-text p {
            margin: 15px 0;
        }

        .story-text em {
            color: #ff4444;
            font-style: italic;
            text-shadow: 0 0 5px rgba(255, 68, 68, 0.5);
        }

        .voice-speed {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            background: rgba(139, 0, 0, 0.2);
            padding: 10px;
            border-radius: 5px;
        }

        .voice-speed input {
            width: 150px;
        }

        /* الإعدادات */
        .settings {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
        }

        .settings-btn {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff4444, #ff6666);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.5);
            transition: all 0.3s;
        }

        .settings-btn:hover {
            background: linear-gradient(135deg, #ff6666, #ff8888);
            box-shadow: 0 0 25px rgba(255, 68, 68, 0.8);
            transform: scale(1.1);
        }

        .settings-panel {
            position: fixed;
            bottom: 100px;
            right: 30px;
            background: linear-gradient(135deg, rgba(26, 26, 26, 0.95), rgba(45, 45, 45, 0.95));
            border: 2px solid #ff4444;
            border-radius: 10px;
            padding: 20px;
            width: 300px;
            display: none;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.8);
            max-height: 400px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .settings-panel.active {
            display: block;
        }

        .settings-panel h3 {
            color: #ff4444;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
        }

        .setting-item {
            margin: 15px 0;
        }

        .setting-item label {
            display: block;
            color: #e0e0e0;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .setting-item input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .setting-item select {
            width: 100%;
            padding: 8px;
            background: rgba(51, 51, 51, 0.8);
            color: #fff;
            border: 1px solid #ff4444;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff4444, #8b0000);
            width: 0%;
            z-index: 1001;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.8);
        }

        .voice-status {
            background: rgba(0, 255, 0, 0.2);
            border-left: 3px solid #00ff00;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            color: #00ff00;
            font-size: 12px;
        }

        .voice-status.inactive {
            background: rgba(139, 0, 0, 0.2);
            border-left-color: #ff4444;
            color: #ff4444;
        }

        /* Overlay للقائمة الجانبية */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* ==================== تصميم الموبايل ==================== */
        @media (max-width: 768px) {
            /* إخفاء القائمة الجانبية بشكل افتراضي */
            .sidebar {
                transform: translateX(-100%);
                width: 85%;
                max-width: 300px;
            }

            .sidebar.active {
                transform: translateX(0);
                box-shadow: 5px 0 20px rgba(0, 0, 0, 0.8);
            }

            /* إظهار زر القائمة */
            .menu-toggle {
                display: block;
            }

            /* تعديل المحتوى الرئيسي */
            .container {
                margin-left: 0;
                padding: 15px;
            }

            /* تعديل الهيدر */
            header {
                flex-direction: column;
                gap: 10px;
                padding: 15px;
            }

            header h1 {
                font-size: 24px;
            }

            .user-profile {
                width: 100%;
                justify-content: space-between;
                padding: 10px;
            }

            .user-profile img {
                width: 40px;
                height: 40px;
            }

            .user-info .name {
                font-size: 12px;
            }

            .user-info .email {
                font-size: 10px;
            }

            .logout-btn {
                padding: 6px 15px;
                font-size: 12px;
            }

            /* تعديل عنوان القصة */
            .story-title {
                font-size: 24px;
                margin: 15px 0;
            }

            /* تعديل نص القصة */
            .story-text {
                font-size: 16px;
                padding: 15px;
                line-height: 1.6;
            }

            /* تعديل الأزرار */
            .story-controls {
                flex-direction: column;
                gap: 8px;
            }

            .story-btn {
                width: 100%;
                justify-content: center;
                padding: 15px;
                font-size: 16px;
            }

            /* تعديل الإعدادات */
            .settings {
                bottom: 20px;
                right: 20px;
            }

            .settings-btn {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }

            .settings-panel {
                width: calc(100vw - 40px);
                right: 20px;
                left: 20px;
                bottom: 80px;
                max-height: 60vh;
            }

            /* تعديل شاشة تسجيل الدخول */
            .login-container {
                padding: 40px 20px;
                width: 95%;
            }

            .login-container h1 {
                font-size: 32px;
            }

            .login-container p {
                font-size: 14px;
            }

            /* تحسين قائمة القصص */
            .story-list li {
                font-size: 15px;
                padding: 15px;
            }
        }

        /* تحسينات إضافية للموبايل الصغير */
        @media (max-width: 480px) {
            .story-text {
                font-size: 15px;
                padding: 12px;
            }

            .story-title {
                font-size: 20px;
            }

            header h1 {
                font-size: 20px;
            }

            .settings-panel {
                max-height: 50vh;
            }
        }
    </style>
</head>
<body>
    <!-- Overlay للقائمة -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- زر القائمة للموبايل -->
    <button class="menu-toggle" id="menuToggle">☰</button>

    <!-- شاشة تسجيل الدخول -->
    <div class="login-screen" id="loginScreen">
        <div class="login-container">
            <h1>👻 قصص الرعب 👻</h1>
            <p>سجل الدخول للاستمتاع بقصص الرعب المرعبة</p>
            
            <div id="g_id_onload"
                data-client_id="295699802302-t4l7rov5vo93g20fuphhbh4sj21dbgu1.apps.googleusercontent.com"
                data-callback="handleCredentialResponse">
            </div>
            <div class="g_id_signin" data-type="standard"></div>
        </div>
    </div>

    <!-- شريط التقدم -->
    <div class="progress-bar" id="progressBar"></div>

    <!-- الرأس -->
    <header id="header" style="display: none;">
        <h1>👻 قصص الرعب المرعبة 👻</h1>
        <div class="user-profile" id="userProfile">
            <img id="userImage" src="" alt="صورة المستخدم">
            <div class="user-info">
                <div class="name" id="userName">المستخدم</div>
                <div class="email" id="userEmail">البريد الإلكتروني</div>
            </div>
            <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
        </div>
    </header>

    <!-- القائمة الجانبية -->
    <div class="sidebar" id="sidebar" style="display: none;">
        <h2>📖 القصص</h2>
        <ul class="story-list" id="storyList">
            <!-- سيتم ملؤها ديناميكياً -->
        </ul>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="container" id="container" style="display: none;">
        <div id="storiesContainer">
            <!-- سيتم ملؤها ديناميكياً -->
        </div>
    </div>

    <!-- الإعدادات -->
    <div class="settings" id="settings" style="display: none;">
        <div class="settings-panel" id="settingsPanel">
            <h3>⚙️ الإعدادات</h3>
            
            <div class="setting-item">
                <label for="fontSize">حجم الخط:</label>
                <input type="range" id="fontSize" min="14" max="24" value="18">
            </div>

            <div class="setting-item">
                <label for="brightness">السطوع:</label>
                <input type="range" id="brightness" min="30" max="100" value="100">
            </div>

            <div class="setting-item">
                <label for="voiceSpeed">سرعة الكشافة:</label>
                <input type="range" id="voiceSpeed" min="0.5" max="2" step="0.1" value="1">
                <span id="speedValue">1x</span>
            </div>

            <div class="setting-item">
                <label for="voiceVolume">مستوى الصوت:</label>
                <input type="range" id="voiceVolume" min="0" max="1" step="0.1" value="1">
            </div>

            <div class="setting-item">
                <label for="voicePitch">درجة الصوت:</label>
                <input type="range" id="voicePitch" min="0.5" max="2" step="0.1" value="1">
            </div>
            
            <div class="setting-item" id="audioTestSection" style="display: none;">
                <button class="story-btn" onclick="testAudio()" style="width: 100%; margin-top: 10px;">
                    🔊 اختبار الصوت (للهواتف)
                </button>
                <div id="audioTestStatus" style="color: #ff4444; margin-top: 5px; font-size: 12px;"></div>
            </div>
        </div>

        <button class="settings-btn" id="settingsToggle">⚙️</button>
    </div>

    <script>
        // متغيرات المستخدم
        let currentUser = null;
        let currentStory = 0;
        let isSpeaking = false;
        let utterance = null;
        let isPaused = false;

        // تهيئة خاصة للهواتف المحمولة
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        let audioInitialized = false;
        
        // التأكد من دعم القراءة الصوتية
        if (!window.speechSynthesis) {
            console.error('المتصفح لا يدعم القراءة الصوتية');
        }
        
        // للهواتف: تهيئة الصوت عند أول تفاعل (نقر أو لمس)
        function initAudioForMobile() {
            if (!audioInitialized) {
                const utterance = new SpeechSynthesisUtterance('');
                utterance.volume = 0;
                speechSynthesis.speak(utterance);
                speechSynthesis.cancel();
                audioInitialized = true;
                console.log('تم تهيئة الصوت للهاتف');
            }
        }
        
        if (isMobile) {
            // تهيئة عند اللمس
            document.addEventListener('touchstart', initAudioForMobile, { once: true });
            // تهيئة عند النقر أيضاً
            document.addEventListener('click', initAudioForMobile, { once: true });
        }

        // دالة تنظيف النص من الرموز قبل القراءة
        function cleanTextForSpeech(text) {
            return text
                .replace(/\-/g, ' ')  // استبدال الشرطة بمسافة
                .replace(/\_/g, ' ')  // استبدال الشرطة السفلية بمسافة
                .replace(/\*/g, ' ')  // حذف النجمة
                .replace(/\#/g, ' ')  // حذف الهاشتاق
                .replace(/\@/g, ' ')  // حذف @
                .replace(/\$/g, ' ')  // حذف $
                .replace(/\%/g, ' بالمئة ')  // استبدال % بـ"بالمئة"
                .replace(/\&/g, ' و ')  // استبدال & بـ"و"
                .replace(/\+/g, ' زائد ')  // استبدال + بـ"زائد"
                .replace(/\=/g, ' يساوي ')  // استبدال = بـ"يساوي"
                .replace(/\</g, ' أصغر من ')  // استبدال < بـ"أصغر من"
                .replace(/\>/g, ' أكبر من ')  // استبدال > بـ"أكبر من"
                .replace(/\|/g, ' ')  // حذف |
                .replace(/\\/g, ' ')  // حذف \
                .replace(/\//g, ' ')  // حذف /
                .replace(/\[/g, ' ')  // حذف [
                .replace(/\]/g, ' ')  // حذف ]
                .replace(/\{/g, ' ')  // حذف {
                .replace(/\}/g, ' ')  // حذف }
                .replace(/\(/g, ' ')  // حذف (
                .replace(/\)/g, ' ')  // حذف )
                .replace(/\~/g, ' ')  // حذف ~
                .replace(/\`/g, ' ')  // حذف `
                .replace(/\^/g, ' ')  // حذف ^
                .replace(/\;/g, ' ')  // حذف ;
                .replace(/\:/g, ' ')  // حذف :
                .replace(/\"/g, ' ')  // حذف "
                .replace(/\'/g, ' ')  // حذف '
                .replace(/\s+/g, ' ')  // استبدال المسافات المتعددة بمسافة واحدة
                .trim();
        }

        // بيانات القصص (20 قصة)
        const stories = [
            {
                id: 0,
                title: 'الساعة الملعونة',

        // معالج استجابة Google
        function handleCredentialResponse(response) {
            const responsePayload = decodeJwtResponse(response.credential);
            
            currentUser = {
                id: responsePayload.sub,
                name: responsePayload.name,
                email: responsePayload.email,
                picture: responsePayload.picture
            };

            localStorage.setItem('user', JSON.stringify(currentUser));
            displayUser(currentUser);
            showMainContent();
        }

        // فك تشفير JWT
        function decodeJwtResponse(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // عرض بيانات المستخدم
        function displayUser(user) {
            document.getElementById('userImage').src = user.picture;
            document.getElementById('userName').textContent = user.name;
            document.getElementById('userEmail').textContent = user.email;
        }

        // بناء القصص ديناميكياً

            const storyList = document.getElementById('storyList');
            const storiesContainer = document.getElementById('storiesContainer');

                li.dataset.story = index;
                li.textContent = `${index + 1}. ${story.title}`;
                if (index === 0) li.classList.add('active');
                li.addEventListener('click', () => {
                    selectStory(index);
                    // إغلاق القائمة على الموبايل
                    if (window.innerWidth <= 768) {
                        closeSidebar();
                    }
                });
                storyList.appendChild(li);

                // إضافة القصة
                const storyDiv = document.createElement('div');
                storyDiv.className = 'story' + (index === 0 ? ' active' : '');
                storyDiv.id = `story-${index}`;
                storyDiv.innerHTML = `
                    <h2 class="story-title">${story.title}</h2>
                    <div class="story-controls">
                        <button class="story-btn" onclick="speakStory(${index})">
                            🔊 قراءة القصة
                        </button>
                        <button class="story-btn" onclick="stopSpeaking()">
                            ⏹️ توقف
                        </button>
                    </div>
                    <div class="voice-status inactive" id="status-${index}">🔴 لم يتم التشغيل</div>
                    <div class="story-text">
                        ${story.text.split('. ').map(p => p.trim() ? `<p>${p}.</p>` : '').join('')}
                    </div>
                `;
                storiesContainer.appendChild(storyDiv);
            });
        }

        // تحديد قصة
        function selectStory(index) {
            document.querySelectorAll('.story').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.story-list li').forEach(l => l.classList.remove('active'));

            document.getElementById(`story-${index}`).classList.add('active');
            document.querySelector(`[data-story="${index}"]`).classList.add('active');
            currentStory = index;

            updateProgressBar();
            saveProgress();
            stopSpeaking();

            // Scroll إلى أعلى
            document.querySelector('.container').scrollTop = 0;
        }

        // قراءة القصة بصوت (مع تنظيف النص)
        function speakStory(index) {
            // إيقاف أي قراءة سابقة
            stopSpeaking();
            
            const story = stories[index];
            const text = cleanTextForSpeech(story.text);
            const statusEl = document.getElementById(`status-${index}`);
            
            // للهواتف: تهيئة الصوت أولاً
            if (isMobile && !audioInitialized) {
                initAudioForMobile();
            }
            
            try {
                // إنشاء utterance جديد مباشرة
                utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                utterance.rate = parseFloat(document.getElementById('voiceSpeed').value);
                utterance.volume = parseFloat(document.getElementById('voiceVolume').value);
                utterance.pitch = parseFloat(document.getElementById('voicePitch').value);
                
                // عند بدء القراءة
                utterance.onstart = () => {
                    isSpeaking = true;
                    statusEl.textContent = '🟢 جاري القراءة...';
                    statusEl.classList.remove('inactive');
                    console.log('بدأت القراءة');
                };
                
                // عند انتهاء القراءة
                utterance.onend = () => {
                    if (isSpeaking) { // فقط إذا لم يتم إيقافها يدوياً
                        isSpeaking = false;
                        statusEl.textContent = '✅ انتهت القراءة';
                        statusEl.classList.add('inactive');
                        console.log('انتهت القراءة');
                    }
                };
                
                // عند حدوث خطأ
                utterance.onerror = (event) => {
                    console.log('نوع الخطأ:', event.error);
                    // فقط اظهر رسالة خطأ للأخطاء الحقيقية، ليس عند الإلغاء
                    if (event.error !== 'canceled' && event.error !== 'interrupted') {
                        statusEl.textContent = '❌ خطأ في التشغيل';
                        statusEl.classList.add('inactive');
                        isSpeaking = false;
                    }
                };
                
                // بدء القراءة مباشرة
                statusEl.textContent = '⏳ جاري التحضير...';
                statusEl.classList.remove('inactive');
                
                // تنظيف قائمة الانتظار
                speechSynthesis.cancel();
                
                // بدء القراءة
                speechSynthesis.speak(utterance);
                
                // للهواتف: التحقق من بدء القراءة
                if (isMobile) {
                    setTimeout(() => {
                        if (!isSpeaking && speechSynthesis.speaking) {
                            isSpeaking = true;
                        }
                        // إذا لم تبدأ القراءة، حاول مرة أخرى
                        if (!speechSynthesis.speaking && !isSpeaking) {
                            console.log('إعادة المحاولة...');
                            speechSynthesis.speak(utterance);
                        }
                    }, 500);
                }
                
            } catch (error) {
                console.error('خطأ في بدء القراءة:', error);
                statusEl.textContent = '❌ فشل التشغيل - جرب مرة أخرى';
                statusEl.classList.add('inactive');
                isSpeaking = false;
            }
        }

        // إيقاف القراءة
        function stopSpeaking() {
            try {
                if (isSpeaking || speechSynthesis.speaking) {
                    speechSynthesis.cancel();
                    isSpeaking = false;
                    isPaused = false;
                    
                    // تحديث جميع حالات القراءة
                    document.querySelectorAll('.voice-status').forEach(s => {
                        s.textContent = '⏹️ تم الإيقاف';
                        s.classList.add('inactive');
                    });
                    
                    console.log('تم إيقاف القراءة');
                }
            } catch (error) {
                console.error('خطأ في إيقاف القراءة:', error);
            }
        }
        
        // اختبار الصوت للهواتف
        function testAudio() {
            const statusEl = document.getElementById('audioTestStatus');
            statusEl.textContent = '⏳ جاري الاختبار...';
            
            try {
                // تهيئة الصوت
                if (!audioInitialized) {
                    initAudioForMobile();
                }
                
                // إنشاء نص اختبار
                const testUtterance = new SpeechSynthesisUtterance('مرحبا، هذا اختبار للقراءة الصوتية');
                testUtterance.lang = 'ar-SA';
                testUtterance.rate = 1;
                testUtterance.volume = 1;
                testUtterance.pitch = 1;
                
                testUtterance.onstart = () => {
                    statusEl.textContent = '✅ الصوت يعمل بشكل صحيح!';
                    statusEl.style.color = '#00ff00';
                };
                
                testUtterance.onend = () => {
                    setTimeout(() => {
                        statusEl.textContent = '';
                    }, 3000);
                };
                
                testUtterance.onerror = (event) => {
                    statusEl.textContent = '❌ خطأ: ' + event.error;
                    statusEl.style.color = '#ff0000';
                };
                
                speechSynthesis.cancel();
                speechSynthesis.speak(testUtterance);
                
            } catch (error) {
                statusEl.textContent = '❌ فشل الاختبار: ' + error.message;
                statusEl.style.color = '#ff0000';
            }
        }

        // تحديث شريط التقدم
        function updateProgressBar() {
            const progress = ((currentStory + 1) / stories.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        // حفظ التقدم
        function saveProgress() {
            if (currentUser) {
                localStorage.setItem('lastStory', currentStory);
            }
        }

        // إظهار المحتوى الرئيسي
        function showMainContent() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('header').style.display = 'flex';
            document.getElementById('sidebar').style.display = 'block';
            document.getElementById('container').style.display = 'block';
            document.getElementById('settings').style.display = 'block';

            buildStories();
            restoreSettings();
        }

        // تسجيل الخروج
        function logout() {
            localStorage.removeItem('user');
            localStorage.removeItem('lastStory');
            currentUser = null;
            stopSpeaking();
            location.reload();
        }

        // استعادة الإعدادات
        function restoreSettings() {
            const fontSize = localStorage.getItem('fontSize');
            const brightness = localStorage.getItem('brightness');
            const lastStory = localStorage.getItem('lastStory');
            const voiceSpeed = localStorage.getItem('voiceSpeed');
            const voiceVolume = localStorage.getItem('voiceVolume');
            const voicePitch = localStorage.getItem('voicePitch');

            if (fontSize) {
                document.getElementById('fontSize').value = fontSize;
                document.getElementById('fontSize').dispatchEvent(new Event('input'));
            }
            if (brightness) {
                document.getElementById('brightness').value = brightness;
                document.getElementById('brightness').dispatchEvent(new Event('input'));
            }
            if (voiceSpeed) {
                document.getElementById('voiceSpeed').value = voiceSpeed;
                document.getElementById('speedValue').textContent = voiceSpeed + 'x';
            }
            if (voiceVolume) {
                document.getElementById('voiceVolume').value = voiceVolume;
            }
            if (voicePitch) {
                document.getElementById('voicePitch').value = voicePitch;
            }
            if (lastStory) {
                selectStory(parseInt(lastStory));
            }
        }

        // فتح/إغلاق القائمة الجانبية (للموبايل)
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        }

        // تبديل الإعدادات
        document.addEventListener('DOMContentLoaded', () => {
            // إظهار زر اختبار الصوت للهواتف فقط
            if (isMobile) {
                const audioTestSection = document.getElementById('audioTestSection');
                if (audioTestSection) {
                    audioTestSection.style.display = 'block';
                }
            }
            
            // زر القائمة للموبايل
            const menuToggle = document.getElementById('menuToggle');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            
            if (menuToggle) {
                menuToggle.addEventListener('click', toggleSidebar);
            }

            if (sidebarOverlay) {
                sidebarOverlay.addEventListener('click', closeSidebar);
            }

            const settingsToggle = document.getElementById('settingsToggle');
            if (settingsToggle) {
                settingsToggle.addEventListener('click', () => {
                    document.getElementById('settingsPanel').classList.toggle('active');
                });
            }

            // حجم الخط
            const fontSizeInput = document.getElementById('fontSize');
            if (fontSizeInput) {
                fontSizeInput.addEventListener('input', (e) => {
                    document.querySelectorAll('.story-text').forEach(text => {
                        text.style.fontSize = e.target.value + 'px';
                    });
                    localStorage.setItem('fontSize', e.target.value);
                });
            }

            // السطوع
            const brightnessInput = document.getElementById('brightness');
            if (brightnessInput) {
                brightnessInput.addEventListener('input', (e) => {
                    document.body.style.filter = `brightness(${e.target.value}%)`;
                    localStorage.setItem('brightness', e.target.value);
                });
            }

            // سرعة الصوت
            const voiceSpeedInput = document.getElementById('voiceSpeed');
            if (voiceSpeedInput) {
                voiceSpeedInput.addEventListener('input', (e) => {
                    document.getElementById('speedValue').textContent = e.target.value + 'x';
                    if (utterance) {
                        utterance.rate = parseFloat(e.target.value);
                    }
                    localStorage.setItem('voiceSpeed', e.target.value);
                });
            }

            // مستوى الصوت
            const voiceVolumeInput = document.getElementById('voiceVolume');
            if (voiceVolumeInput) {
                voiceVolumeInput.addEventListener('input', (e) => {
                    if (utterance) {
                        utterance.volume = parseFloat(e.target.value);
                    }
                    localStorage.setItem('voiceVolume', e.target.value);
                });
            }

            // درجة الصوت
            const voicePitchInput = document.getElementById('voicePitch');
            if (voicePitchInput) {
                voicePitchInput.addEventListener('input', (e) => {
                    if (utterance) {
                        utterance.pitch = parseFloat(e.target.value);
                    }
                    localStorage.setItem('voicePitch', e.target.value);
                });
            }
        });

        // فحص تسجيل الدخول عند التحميل
        window.addEventListener('load', () => {
            const savedUser = localStorage.getItem('user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                displayUser(currentUser);
                showMainContent();
            }
        });

        window.handleCredentialResponse = handleCredentialResponse;
    </script>
</body>
</html>
