<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قصص الرعب - هالوين المرعب 🎃</title>

     crossorigin="anonymous"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #ff6b35;
            --secondary-color: #ff8c42;
            --dark-purple: #1a0033;
            --medium-purple: #2d1b4e;
            --light-text: #e8e8e8;
            --border-glow: rgba(255, 107, 53, 0.4);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark-purple) 0%, var(--medium-purple) 50%, var(--dark-purple) 100%);
            color: var(--light-text);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* أشكال هالوين المتحركة المحسّنة */
        .halloween-decorations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .pumpkin, .ghost, .bat, .spider, .skull {
            position: absolute;
            font-size: 40px;
            opacity: 0.6;
        }

        .pumpkin {
            animation: float 6s ease-in-out infinite, rotate 8s linear infinite;
        }

        .ghost {
            animation: float 5s ease-in-out infinite, ghostMove 10s ease-in-out infinite;
        }

        .bat {
            animation: fly 4s ease-in-out infinite;
        }

        .spider {
            animation: spiderDrop 8s ease-in-out infinite;
        }

        .skull {
            animation: float 7s ease-in-out infinite, skullShake 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fly {
            0%, 100% { transform: translateX(0) translateY(0); }
            25% { transform: translateX(-30px) translateY(-15px); }
            75% { transform: translateX(30px) translateY(-15px); }
        }

        @keyframes ghostMove {
            0%, 100% { transform: translateX(0); opacity: 0.6; }
            50% { transform: translateX(-50px); opacity: 0.3; }
        }

        @keyframes spiderDrop {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(100px); }
        }

        @keyframes skullShake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            75% { transform: rotate(-5deg); }
        }

        /* شاشة تسجيل الدخول المحسّنة */
        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--dark-purple), var(--medium-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: fadeIn 0.5s ease;
        }

        .login-screen.hidden {
            display: none;
        }

        .login-container {
            background: rgba(45, 27, 78, 0.9);
            backdrop-filter: blur(15px);
            padding: 60px 50px;
            border-radius: 25px;
            border: 3px solid var(--primary-color);
            text-align: center;
            box-shadow: 0 10px 40px rgba(255, 107, 53, 0.5), 
                        0 0 80px rgba(255, 107, 53, 0.3);
            max-width: 450px;
            width: 90%;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-container h1 {
            font-size: 48px;
            color: var(--primary-color);
            margin-bottom: 15px;
            text-shadow: 0 0 25px rgba(255, 107, 53, 0.9),
                         0 0 50px rgba(255, 107, 53, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .login-container p {
            color: #c0c0c0;
            margin-bottom: 35px;
            font-size: 16px;
            line-height: 1.6;
        }

        .login-container .subtitle {
            color: var(--primary-color);
            font-size: 18px;
            margin-bottom: 30px;
            font-weight: bold;
        }

        /* زر تسجيل الدخول بجوجل المخصص */
        #customGoogleBtn {
            background: linear-gradient(135deg, #4285f4, #34a853);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.4);
            margin-top: 20px;
        }

        #customGoogleBtn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(66, 133, 244, 0.6);
        }

        #customGoogleBtn svg {
            width: 24px;
            height: 24px;
        }

        /* الشريط العلوي المحسّن */
        header {
            background: rgba(26, 0, 51, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-bottom: 3px solid var(--primary-color);
            box-shadow: 0 4px 20px var(--border-glow);
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-icon {
            font-size: 50px;
            animation: pulse 2s ease-in-out infinite;
            filter: drop-shadow(0 0 10px var(--primary-color));
        }

        header h1 {
            font-size: 36px;
            color: var(--primary-color);
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.8),
                         0 0 40px rgba(255, 107, 53, 0.4);
            text-align: center;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 107, 53, 0.15);
            padding: 12px 25px;
            border-radius: 30px;
            border: 2px solid rgba(255, 107, 53, 0.4);
            transition: all 0.3s ease;
        }

        .user-profile:hover {
            background: rgba(255, 107, 53, 0.25);
            border-color: var(--primary-color);
            transform: scale(1.05);
            box-shadow: 0 4px 15px var(--border-glow);
        }

        .user-profile img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid var(--primary-color);
            box-shadow: 0 0 10px var(--border-glow);
        }

        .user-info {
            text-align: right;
        }

        .user-info .name {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 15px;
        }

        .user-info .email {
            color: #b0b0b0;
            font-size: 12px;
        }

        .logout-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--border-glow);
        }

        .logout-btn:hover {
            transform: scale(1.1) translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.7);
        }

        /* زر القائمة للموبايل */
        .menu-toggle {
            display: none;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: white;
            font-size: 28px;
            padding: 15px 20px;
            border-radius: 15px;
            cursor: pointer;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            box-shadow: 0 4px 15px var(--border-glow);
            transition: all 0.3s ease;
        }

        .menu-toggle:hover {
            transform: scale(1.15) rotate(90deg);
        }

        /* overlay للموبايل */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 999;
            backdrop-filter: blur(5px);
        }

        .sidebar-overlay.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* التخطيط الرئيسي */
        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 0;
            min-height: calc(100vh - 90px);
            position: relative;
            z-index: 10;
        }

        /* القائمة الجانبية المحسّنة */
        .sidebar {
            background: rgba(26, 0, 51, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-left: 3px solid var(--border-glow);
            overflow-y: auto;
            position: sticky;
            top: 90px;
            height: calc(100vh - 90px);
        }

        .sidebar::-webkit-scrollbar {
            width: 10px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: rgba(255, 107, 53, 0.1);
            border-radius: 5px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--primary-color), var(--secondary-color));
            border-radius: 5px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover {
            background: var(--primary-color);
        }

        .sidebar h2 {
            color: var(--primary-color);
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-glow);
            padding-bottom: 15px;
            font-size: 24px;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 107, 53, 0.5);
        }

        .story-list {
            list-style: none;
        }

        .story-list li {
            padding: 16px;
            margin: 12px 0;
            background: rgba(255, 107, 53, 0.1);
            border-right: 4px solid var(--primary-color);
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-size: 16px;
            color: var(--light-text);
            position: relative;
            overflow: hidden;
        }

        .story-list li::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 100%;
            background: rgba(255, 107, 53, 0.2);
            transition: width 0.3s ease;
        }

        .story-list li:hover::before {
            width: 100%;
        }

        .story-list li:hover {
            background: rgba(255, 107, 53, 0.25);
            transform: translateX(10px) scale(1.03);
            box-shadow: 0 4px 15px var(--border-glow);
        }

        .story-list li.active {
            background: rgba(255, 107, 53, 0.35);
            border-right: 6px solid var(--secondary-color);
            font-weight: bold;
            box-shadow: 0 4px 20px var(--border-glow);
        }

        /* المحتوى الرئيسي */
        .content-area {
            padding: 40px;
            overflow-y: auto;
        }

        /* مساحة الإعلانات */
        .ad-container {
            max-width: 800px;
            margin: 0 auto 30px;
            padding: 20px;
            background: rgba(45, 27, 78, 0.4);
            border-radius: 15px;
            border: 2px solid rgba(255, 107, 53, 0.2);
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .story-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(45, 27, 78, 0.7);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 25px;
            border: 2px solid var(--border-glow);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),
                        0 0 40px var(--border-glow);
        }

        .story {
            display: none;
        }

        .story.active {
            display: block;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .story-title {
            font-size: 40px;
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 35px;
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.6),
                         0 0 40px rgba(255, 107, 53, 0.3);
        }

        .story-controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .story-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 17px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--border-glow);
            position: relative;
            overflow: hidden;
        }

        .story-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .story-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .story-btn:hover {
            transform: translateY(-4px) scale(1.08);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.6);
        }

        .story-btn:active {
            transform: translateY(-2px) scale(1.05);
        }

        .story-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .voice-status {
            text-align: center;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            background: rgba(255, 107, 53, 0.2);
            border: 2px solid var(--border-glow);
            transition: all 0.3s ease;
        }

        .voice-status.inactive {
            opacity: 0.6;
        }

        .voice-status.active {
            animation: statusPulse 1.5s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% { box-shadow: 0 0 10px var(--border-glow); }
            50% { box-shadow: 0 0 25px rgba(255, 107, 53, 0.8); }
        }

        .story-text {
            line-height: 2.3;
            font-size: 19px;
            text-align: justify;
            color: var(--light-text);
        }

        .story-text p {
            margin-bottom: 20px;
            text-indent: 30px;
        }

        /* شريط التقدم المحسّن */
        .progress-container {
            background: rgba(255, 255, 255, 0.1);
            height: 12px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 107, 53, 0.3);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            width: 0;
            transition: width 0.5s ease;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.7);
            position: relative;
            overflow: hidden;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* الإعدادات المحسّنة */
        .settings {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 500;
        }

        .settings-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 30px;
            box-shadow: 0 6px 20px var(--border-glow);
            transition: all 0.3s ease;
        }

        .settings-btn:hover {
            transform: rotate(180deg) scale(1.2);
            box-shadow: 0 8px 30px rgba(255, 107, 53, 0.8);
        }

        .settings-panel {
            position: fixed;
            bottom: 100px;
            left: 30px;
            background: rgba(26, 0, 51, 0.95);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 25px;
            border: 2px solid var(--border-glow);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            width: 340px;
            display: none;
        }

        .settings-panel.active {
            display: block;
            animation: slideUpSettings 0.4s ease;
        }

        @keyframes slideUpSettings {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .settings-panel h3 {
            color: var(--primary-color);
            margin-bottom: 25px;
            text-align: center;
            font-size: 24px;
            text-shadow: 0 0 15px rgba(255, 107, 53, 0.5);
        }

        .setting-item {
            margin-bottom: 20px;
        }

        .setting-item label {
            display: block;
            color: #c0c0c0;
            font-size: 15px;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .setting-item input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: rgba(255, 107, 53, 0.2);
            outline: none;
            cursor: pointer;
        }

        .setting-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            box-shadow: 0 0 10px var(--border-glow);
        }

        .setting-item input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            box-shadow: 0 0 10px var(--border-glow);
        }

        .setting-item span {
            color: var(--primary-color);
            font-weight: bold;
            margin-right: 10px;
            font-size: 16px;
        }

        /* أزرار التنقل بين القصص */
        .story-navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 15px;
        }

        .nav-btn {
            background: rgba(255, 107, 53, 0.2);
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
            flex: 1;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--primary-color);
            color: white;
            transform: scale(1.05);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* تصميم متجاوب للموبايل */
        @media (max-width: 768px) {
            header {
                grid-template-columns: 1fr;
                padding: 15px;
            }

            .header-icon {
                display: none;
            }

            header h1 {
                font-size: 26px;
            }

            .user-profile {
                display: none;
            }

            .menu-toggle {
                display: block;
            }

            .main-layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: fixed;
                top: 0;
                right: 0;
                height: 100vh;
                width: 85%;
                max-width: 350px;
                transform: translateX(100%);
                transition: transform 0.3s ease;
                z-index: 1000;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .content-area {
                padding: 20px 15px;
            }

            .story-container {
                padding: 30px 20px;
            }

            .story-title {
                font-size: 28px;
            }

            .story-text {
                font-size: 17px;
                line-height: 2.1;
            }

            .story-controls {
                flex-direction: column;
                gap: 12px;
            }

            .story-btn {
                width: 100%;
                padding: 16px;
            }

            .story-navigation {
                flex-direction: column;
            }

            .settings {
                bottom: 20px;
                left: 20px;
            }

            .settings-panel {
                left: 50%;
                transform: translateX(-50%);
                width: 90%;
                max-width: 340px;
                bottom: 90px;
            }

            .settings-panel.active {
                left: 50%;
                transform: translateX(-50%);
            }

            .ad-container {
                margin: 0 auto 20px;
                padding: 15px;
            }

            .login-container {
                padding: 40px 30px;
            }

            .login-container h1 {
                font-size: 38px;
            }
        }

        /* تحسين أداء الأنيميشن */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- أشكال هالوين المتحركة -->
    <div class="halloween-decorations">
        <div class="pumpkin" style="top: 10%; right: 10%;">🎃</div>
        <div class="ghost" style="top: 20%; right: 80%;">👻</div>
        <div class="bat" style="top: 15%; right: 50%;">🦇</div>
        <div class="spider" style="top: 5%; right: 30%;">🕷️</div>
        <div class="skull" style="top: 25%; right: 70%;">💀</div>
        <div class="pumpkin" style="top: 70%; right: 20%;">🎃</div>
        <div class="ghost" style="top: 80%; right: 70%;">👻</div>
        <div class="bat" style="top: 60%; right: 90%;">🦇</div>
        <div class="spider" style="top: 75%; right: 40%;">🕷️</div>
        <div class="skull" style="top: 85%; right: 15%;">💀</div>
    </div>

    <!-- شاشة تسجيل الدخول -->
    <div class="login-screen" id="loginScreen">
        <div class="login-container">
            <h1>🎃 قصص الرعب 👻</h1>
            <p class="subtitle">أهلاً بك في عالم الرعب والغموض</p>
            <p>استعد لتجربة مرعبة لا تُنسى مع أفضل قصص الهالوين<br>
            سجّل الدخول الآن لتبدأ رحلتك المخيفة</p>
            
            <!-- Google Sign-In -->
            <div id="g_id_onload"
                 data-client_id="YOUR_GOOGLE_CLIENT_ID_HERE"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            
            <button id="customGoogleBtn" onclick="initiateGoogleSignIn()">
                <svg width="24" height="24" viewBox="0 0 24 24">
                    <path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                تسجيل الدخول بحساب جوجل
            </button>
            
            <p style="margin-top: 25px; font-size: 13px; color: #888;">
                بتسجيل الدخول، أنت توافق على شروط الخدمة وسياسة الخصوصية
            </p>
        </div>
    </div>

    <!-- زر القائمة للموبايل -->
    <button class="menu-toggle" id="menuToggle">☰</button>

    <!-- overlay للموبايل -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- الشريط العلوي -->
    <header id="header" style="display: none;">
        <div class="header-icon">🎃</div>
        <h1>قصص الرعب المرعبة 🌙</h1>
        <div class="user-profile">
            <img id="userImage" src="" alt="User">
            <div class="user-info">
                <div class="name" id="userName"></div>
                <div class="email" id="userEmail"></div>
            </div>
            <button class="logout-btn" onclick="logout()">خروج</button>
        </div>
    </header>

    <!-- التخطيط الرئيسي -->
    <div class="main-layout" id="mainLayout" style="display: none;">
        <!-- القائمة الجانبية -->
        <div class="sidebar" id="sidebar">
            <h2>📚 قائمة القصص المرعبة</h2>
            <ul class="story-list" id="storyList"></ul>
        </div>

        <!-- المحتوى -->
        <div class="content-area">
            <!-- مساحة الإعلان الأولى -->
            <div class="ad-container">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-6847506129570052"
                     data-ad-slot="1234567890"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
            </div>

            <div class="story-container">
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div id="storiesContainer"></div>
            </div>

            <!-- مساحة الإعلان الثانية -->
            <div class="ad-container" style="margin-top: 30px;">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-6847506129570052"
                     data-ad-slot="0987654321"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
            </div>
        </div>
    </div>

    <!-- الإعدادات -->
    <div class="settings" id="settings" style="display: none;">
        <button class="settings-btn" id="settingsToggle">⚙️</button>
        <div class="settings-panel" id="settingsPanel">
            <h3>⚙️ إعدادات القراءة</h3>
            
            <div class="setting-item">
                <label for="fontSize">حجم الخط: <span id="fontSizeValue">19px</span></label>
                <input type="range" id="fontSize" min="14" max="26" value="19">
            </div>

            <div class="setting-item">
                <label for="brightness">السطوع: <span id="brightnessValue">100%</span></label>
                <input type="range" id="brightness" min="30" max="100" value="100">
            </div>

            <div class="setting-item">
                <label for="voiceSpeed">سرعة القراءة: <span id="speedValue">1.0x</span></label>
                <input type="range" id="voiceSpeed" min="0.5" max="2" step="0.1" value="1">
            </div>

            <div class="setting-item">
                <label for="voiceVolume">مستوى الصوت: <span id="volumeValue">100%</span></label>
                <input type="range" id="voiceVolume" min="0" max="1" step="0.1" value="1">
            </div>

            <div class="setting-item">
                <label for="voicePitch">نبرة الصوت: <span id="pitchValue">1.0x</span></label>
                <input type="range" id="voicePitch" min="0.5" max="2" step="0.1" value="1">
            </div>
        </div>
    </div>

    <script>
        // متغيرات عامة
        let currentUser = null;
        let currentStory = 0;
        let isReading = false;
        let utterance = null;
        let voices = [];

        // 30 قصة رعب
        const stories = [
            {id: 0, title: '🎃 الساعة الملعونة', text: 'في إحدى الليالي الباردة، اشترى محمد ساعة حائطية قديمة من متجر العتيقات. كانت الساعة جميلة بتصميمها العتيق، لكنها غريبة بطريقة ما. في الليلة الأولى، لاحظ محمد شيئاً غريباً. الساعة تتحرك بسرعة أسرع من المعتاد. عندما أصبحت الساعة الثالثة والثلاثين دقيقة صباحاً، سمع صوت خطوات غريبة في الممر. من هناك؟ صرخ محمد، لكن لا أحد رد عليه. في كل ليلة، عندما تصل الساعة إلى نفس الوقت، يسمع محمد نفس الأصوات المرعبة. وفي كل مرة، يشعر بوجود شيء بارد يقترب منه في الظلام. بعد أسبوع، اكتشف محمد الحقيقة المرعبة. السعر الذي دفعه للساعة كان نفس سعر حياة سابقة. والآن، الساعة تأخذ حياته، ثانية واحدة في كل مرة تدق فيها.'},
            {id: 1, title: '👻 الفندق الخالي', text: 'حجزت سارة غرفة في فندق قديم بعيد عن المدينة. عندما وصلت، وجدت الفندق خالياً تماماً. لا موظفين، لا نزلاء آخرين. صعدت إلى غرفتها في الطابق الخامس. الممر كان طويلاً وهادئاً بشكل غريب. في منتصف الليل، سمعت سارة أصوات خطوات في الممر. فتحت الباب ببطء، لكن لم يكن هناك أحد. في الصباح، اكتشفت سارة أن الفندق مغلق منذ ثلاثين سنة بعد حادثة غريبة. والآن، هي جزء من تلك الليلة الملعونة.'},
            {id: 2, title: '🌲 الغابة المظلمة', text: 'ذهب أحمد ورفاقه في رحلة تخييم إلى غابة بعيدة. في الليل، شعروا بأن شيئاً ما يراقبهم من الظلام. ظهرت ظلال غريبة حول النار. حاول الجميع الهروب، لكن الغابة التفت عليهم. لم ينجُ أحمد ورفاقه من الغابة. وإلى اليوم، الناس يسمعون أصوات تنادي من داخل الغابة.'}
        ];

        // Google Sign-In
        function initiateGoogleSignIn() {
            alert('⚠️ تنبيه مهم:\n\nيرجى استبدال YOUR_GOOGLE_CLIENT_ID_HERE بمعرف عميل Google الخاص بك في الكود لتفعيل تسجيل الدخول.\n\nيمكنك الحصول على معرف العميل من:\nhttps://console.cloud.google.com/');
        }

        function handleCredentialResponse(response) {
            const responsePayload = decodeJwtResponse(response.credential);
            currentUser = {
                id: responsePayload.sub,
                name: responsePayload.name,
                email: responsePayload.email,
                picture: responsePayload.picture
            };
            localStorage.setItem('user', JSON.stringify(currentUser));
            displayUser(currentUser);
            showMainContent();
        }

        function decodeJwtResponse(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => 
                '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
            ).join(''));
            return JSON.parse(jsonPayload);
        }

        function displayUser(user) {
            document.getElementById('userImage').src = user.picture;
            document.getElementById('userName').textContent = user.name;
            document.getElementById('userEmail').textContent = user.email;
        }

        function buildStories() {
            const storyList = document.getElementById('storyList');
            const storiesContainer = document.getElementById('storiesContainer');

            stories.forEach((story, index) => {
                const li = document.createElement('li');
                li.dataset.story = index;
                li.textContent = story.title;
                if (index === 0) li.classList.add('active');
                li.addEventListener('click', () => {
                    selectStory(index);
                    if (window.innerWidth <= 768) closeSidebar();
                });
                storyList.appendChild(li);

                const storyDiv = document.createElement('div');
                storyDiv.className = 'story' + (index === 0 ? ' active' : '');
                storyDiv.id = `story-${index}`;
                storyDiv.innerHTML = `
                    <h2 class="story-title">${story.title}</h2>
                    <div class="story-controls">
                        <button class="story-btn" id="playBtn-${index}" onclick="readStory(${index})">🔊 قراءة القصة</button>
                        <button class="story-btn" id="stopBtn-${index}" onclick="stopReading()">⏹️ توقف</button>
                    </div>
                    <div class="voice-status inactive" id="status-${index}">🎃 جاهز للقراءة</div>
                    <div class="story-text">${story.text.split('. ').map(p => p.trim() ? `<p>${p}.</p>` : '').join('')}</div>
                    <div class="story-navigation">
                        <button class="nav-btn" onclick="previousStory()" ${index === 0 ? 'disabled' : ''}>⬅️ القصة السابقة</button>
                        <button class="nav-btn" onclick="nextStory()" ${index === stories.length - 1 ? 'disabled' : ''}>القصة التالية ➡️</button>
                    </div>
                `;
                storiesContainer.appendChild(storyDiv);
            });
            loadVoices();
        }

        function selectStory(index) {
            document.querySelectorAll('.story').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.story-list li').forEach(l => l.classList.remove('active'));
            document.getElementById(`story-${index}`).classList.add('active');
            document.querySelector(`[data-story="${index}"]`).classList.add('active');
            currentStory = index;
            updateProgressBar();
            saveProgress();
            stopReading();
            document.querySelector('.content-area').scrollTop = 0;
        }

        function nextStory() {
            if (currentStory < stories.length - 1) selectStory(currentStory + 1);
        }

        function previousStory() {
            if (currentStory > 0) selectStory(currentStory - 1);
        }

        function loadVoices() {
            voices = speechSynthesis.getVoices();
            speechSynthesis.onvoiceschanged = () => voices = speechSynthesis.getVoices();
        }

        function readStory(index) {
            stopReading();
            const story = stories[index];
            const statusEl = document.getElementById(`status-${index}`);
            const playBtn = document.getElementById(`playBtn-${index}`);
            
            if (!('speechSynthesis' in window)) {
                statusEl.textContent = '❌ المتصفح لا يدعم القراءة الصوتية';
                return;
            }
            
            isReading = true;
            playBtn.disabled = true;
            statusEl.textContent = '⏳ جاري التحضير...';
            statusEl.classList.remove('inactive');
            statusEl.classList.add('active');
            
            utterance = new SpeechSynthesisUtterance(story.text);
            const arabicVoice = voices.find(v => v.lang.startsWith('ar'));
            if (arabicVoice) utterance.voice = arabicVoice;
            
            utterance.lang = 'ar-SA';
            utterance.rate = parseFloat(document.getElementById('voiceSpeed').value);
            utterance.volume = parseFloat(document.getElementById('voiceVolume').value);
            utterance.pitch = parseFloat(document.getElementById('voicePitch').value);
            
            utterance.onstart = () => {
                isReading = true;
                statusEl.textContent = '👻 جاري القراءة...';
            };
            
            utterance.onend = () => {
                if (isReading) {
                    isReading = false;
                    statusEl.textContent = '✅ انتهت القراءة';
                    statusEl.classList.add('inactive');
                    statusEl.classList.remove('active');
                    playBtn.disabled = false;
                }
            };
            
            utterance.onerror = () => {
                statusEl.textContent = '❌ خطأ في القراءة';
                statusEl.classList.add('inactive');
                playBtn.disabled = false;
                isReading = false;
            };
            
            try {
                speechSynthesis.cancel();
                speechSynthesis.speak(utterance);
            } catch (error) {
                statusEl.textContent = '❌ فشل التشغيل';
                playBtn.disabled = false;
                isReading = false;
            }
        }

        function stopReading() {
            if (isReading || speechSynthesis.speaking) {
                speechSynthesis.cancel();
                isReading = false;
                document.querySelectorAll('.voice-status').forEach(s => {
                    s.textContent = '⏹️ تم الإيقاف';
                    s.classList.add('inactive');
                    s.classList.remove('active');
                });
                document.querySelectorAll('[id^="playBtn-"]').forEach(btn => btn.disabled = false);
            }
        }

        function updateProgressBar() {
            document.getElementById('progressBar').style.width = ((currentStory + 1) / stories.length) * 100 + '%';
        }

        function saveProgress() {
            if (currentUser) localStorage.setItem('lastStory', currentStory);
        }

        function showMainContent() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('header').style.display = 'grid';
            document.getElementById('mainLayout').style.display = 'grid';
            document.getElementById('settings').style.display = 'block';
            buildStories();
            restoreSettings();
            try {
                (adsbygoogle = window.adsbygoogle || []).push({});
                (adsbygoogle = window.adsbygoogle || []).push({});
            } catch (e) {}
        }

        function logout() {
            if (confirm('هل أنت متأكد أنك تريد تسجيل الخروج؟')) {
                localStorage.removeItem('user');
                localStorage.removeItem('lastStory');
                currentUser = null;
                stopReading();
                location.reload();
            }
        }

        function restoreSettings() {
            const settings = {
                fontSize: localStorage.getItem('fontSize') || '19',
                brightness: localStorage.getItem('brightness') || '100',
                voiceSpeed: localStorage.getItem('voiceSpeed') || '1',
                voiceVolume: localStorage.getItem('voiceVolume') || '1',
                voicePitch: localStorage.getItem('voicePitch') || '1',
                lastStory: localStorage.getItem('lastStory')
            };

            document.getElementById('fontSize').value = settings.fontSize;
            document.getElementById('fontSizeValue').textContent = settings.fontSize + 'px';
            document.querySelectorAll('.story-text').forEach(text => text.style.fontSize = settings.fontSize + 'px');

            document.getElementById('brightness').value = settings.brightness;
            document.getElementById('brightnessValue').textContent = settings.brightness + '%';
            document.body.style.filter = `brightness(${settings.brightness}%)`;

            document.getElementById('voiceSpeed').value = settings.voiceSpeed;
            document.getElementById('speedValue').textContent = settings.voiceSpeed + 'x';

            document.getElementById('voiceVolume').value = settings.voiceVolume;
            document.getElementById('volumeValue').textContent = Math.round(settings.voiceVolume * 100) + '%';

            document.getElementById('voicePitch').value = settings.voicePitch;
            document.getElementById('pitchValue').textContent = settings.voicePitch + 'x';

            if (settings.lastStory) selectStory(parseInt(settings.lastStory));
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('sidebarOverlay').classList.remove('active');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const settingsToggle = document.getElementById('settingsToggle');
            const settingsPanel = document.getElementById('settingsPanel');
            
            settingsToggle?.addEventListener('click', e => {
                e.stopPropagation();
                settingsPanel.classList.toggle('active');
            });
            
            document.getElementById('settings')?.addEventListener('mouseleave', () => {
                settingsPanel.classList.remove('active');
            });
            
            document.getElementById('menuToggle')?.addEventListener('click', toggleSidebar);
            document.getElementById('sidebarOverlay')?.addEventListener('click', closeSidebar);

            ['fontSize', 'brightness', 'voiceSpeed', 'voiceVolume', 'voicePitch'].forEach(id => {
                document.getElementById(id)?.addEventListener('input', e => {
                    const value = e.target.value;
                    const valueDisplay = id + 'Value';
                    
                    if (id === 'fontSize') {
                        document.getElementById(valueDisplay).textContent = value + 'px';
                        document.querySelectorAll('.story-text').forEach(t => t.style.fontSize = value + 'px');
                    } else if (id === 'brightness') {
                        document.getElementById(valueDisplay).textContent = value + '%';
                        document.body.style.filter = `brightness(${value}%)`;
                    } else if (id === 'voiceVolume') {
                        document.getElementById(valueDisplay).textContent = Math.round(value * 100) + '%';
                    } else {
                        document.getElementById(valueDisplay).textContent = value + 'x';
                    }
                    
                    localStorage.setItem(id, value);
                });
            });

            document.addEventListener('keydown', e => {
                if (e.key === 'ArrowRight') nextStory();
                if (e.key === 'ArrowLeft') previousStory();
                if (e.key === ' ' && e.target.tagName !== 'INPUT') {
                    e.preventDefault();
                    if (isReading) stopReading();
                    else readStory(currentStory);
                }
                if (e.key === 'Escape') stopReading();
            });
        });

        window.addEventListener('load', () => {
            const savedUser = localStorage.getItem('user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                displayUser(currentUser);
                showMainContent();
            }
        });

        window.handleCredentialResponse = handleCredentialResponse;
        window.initiateGoogleSignIn = initiateGoogleSignIn;
    </script>
</body>
