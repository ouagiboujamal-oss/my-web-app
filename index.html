<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قصص الرعب المرعبة</title>
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6847506129570052"
     crossorigin="anonymous"></script>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- ResponsiveVoice للقراءة الصوتية - يعمل على جميع الأجهزة -->
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=jQZ2zboard"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e8e8e8;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* شاشة تسجيل الدخول */
        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f3460, #16213e);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .login-screen.hidden {
            display: none;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
        }

        .login-container h1 {
            font-size: 36px;
            color: #e94560;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }

        .login-container p {
            color: #b8b8b8;
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* الشريط العلوي */
        header {
            background: rgba(22, 33, 62, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-bottom: 2px solid #e94560;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 28px;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
            flex: 1;
            text-align: center;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(233, 69, 96, 0.1);
            padding: 8px 15px;
            border-radius: 25px;
            border: 1px solid rgba(233, 69, 96, 0.3);
        }

        .user-profile img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #e94560;
        }

        .user-info {
            text-align: right;
        }

        .user-info .name {
            color: #e94560;
            font-weight: bold;
            font-size: 13px;
        }

        .user-info .email {
            color: #b8b8b8;
            font-size: 11px;
        }

        .logout-btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #ff6b7a;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
        }

        /* زر القائمة للموبايل */
        .menu-toggle {
            display: none;
            background: #e94560;
            border: none;
            color: white;
            font-size: 20px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        /* overlay للموبايل */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* القائمة الجانبية */
        .sidebar {
            position: fixed;
            left: 0;
            top: 70px;
            width: 280px;
            height: calc(100vh - 70px);
            background: rgba(22, 33, 62, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-right: 2px solid rgba(233, 69, 96, 0.3);
            overflow-y: auto;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: rgba(233, 69, 96, 0.1);
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #e94560;
            border-radius: 3px;
        }

        .sidebar h2 {
            color: #e94560;
            margin-bottom: 15px;
            border-bottom: 2px solid rgba(233, 69, 96, 0.3);
            padding-bottom: 10px;
            font-size: 20px;
        }

        .story-list {
            list-style: none;
        }

        .story-list li {
            padding: 12px;
            margin: 8px 0;
            background: rgba(233, 69, 96, 0.1);
            border-left: 3px solid #e94560;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            font-size: 14px;
            color: #e8e8e8;
        }

        .story-list li:hover {
            background: rgba(233, 69, 96, 0.2);
            transform: translateX(-5px);
        }

        .story-list li.active {
            background: rgba(233, 69, 96, 0.3);
            border-left: 5px solid #ff6b7a;
        }

        /* المحتوى الرئيسي */
        .container {
            margin-right: 300px;
            padding: 30px;
            max-width: 900px;
            min-height: calc(100vh - 70px);
        }

        .story-content {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .story {
            display: none;
        }

        .story.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .story-title {
            font-size: 32px;
            color: #e94560;
            text-align: center;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.3);
        }

        .story-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .story-btn {
            background: linear-gradient(135deg, #e94560, #ff6b7a);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3);
        }

        .story-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(233, 69, 96, 0.5);
        }

        .story-btn:active {
            transform: translateY(0);
        }

        .voice-status {
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            background: rgba(233, 69, 96, 0.1);
            border: 1px solid rgba(233, 69, 96, 0.3);
        }

        .voice-status.inactive {
            opacity: 0.6;
        }

        .story-text {
            line-height: 2;
            font-size: 18px;
            text-align: justify;
            color: #e8e8e8;
        }

        .story-text p {
            margin-bottom: 15px;
        }

        /* شريط التقدم */
        .progress-container {
            background: rgba(255, 255, 255, 0.1);
            height: 8px;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff6b7a);
            width: 0;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        /* الإعدادات */
        .settings {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 500;
        }

        .settings-btn {
            background: linear-gradient(135deg, #e94560, #ff6b7a);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
            transition: all 0.3s;
        }

        .settings-btn:hover {
            transform: rotate(90deg) scale(1.1);
        }

        .settings-panel {
            position: fixed;
            bottom: 80px;
            left: 20px;
            background: rgba(22, 33, 62, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid rgba(233, 69, 96, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 300px;
            display: none;
        }

        .settings-panel.active {
            display: block;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .settings-panel h3 {
            color: #e94560;
            margin-bottom: 15px;
            text-align: center;
        }

        .setting-item {
            margin-bottom: 15px;
        }

        .setting-item label {
            display: block;
            color: #b8b8b8;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .setting-item input[type="range"] {
            width: 100%;
            accent-color: #e94560;
        }

        .setting-item span {
            color: #e94560;
            font-weight: bold;
            margin-right: 10px;
        }

        /* تصميم متجاوب للموبايل */
        @media (max-width: 768px) {
            header h1 {
                font-size: 20px;
            }

            .user-profile {
                display: none;
            }

            .menu-toggle {
                display: block;
            }

            .sidebar {
                transform: translateX(100%);
                top: 0;
                height: 100vh;
                width: 80%;
                max-width: 300px;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .container {
                margin-right: 0;
                padding: 15px;
            }

            .story-content {
                padding: 20px 15px;
            }

            .story-title {
                font-size: 24px;
            }

            .story-text {
                font-size: 16px;
                line-height: 1.8;
            }

            .story-controls {
                flex-direction: column;
            }

            .story-btn {
                width: 100%;
            }

            .settings-panel {
                left: 50%;
                transform: translateX(-50%);
                width: 90%;
                max-width: 300px;
            }

            .settings-panel.active {
                left: 50%;
                transform: translateX(-50%);
            }
        }
    </style>
</head>
<body>
    <!-- شاشة تسجيل الدخول -->
    <div class="login-screen" id="loginScreen">
        <div class="login-container">
            <h1>👻 قصص الرعب</h1>
            <p>سجل الدخول للاستمتاع بأفضل القصص المرعبة</p>
            <div id="g_id_onload"
                 data-client_id="YOUR_GOOGLE_CLIENT_ID"
                 data-callback="handleCredentialResponse">
            </div>
            <div class="g_id_signin" data-type="standard"></div>
        </div>
    </div>

    <!-- زر القائمة للموبايل -->
    <button class="menu-toggle" id="menuToggle">☰</button>

    <!-- overlay للموبايل -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- الشريط العلوي -->
    <header id="header" style="display: none;">
        <h1>👻 قصص الرعب المرعبة</h1>
        <div class="user-profile">
            <img id="userImage" src="" alt="User">
            <div class="user-info">
                <div class="name" id="userName"></div>
                <div class="email" id="userEmail"></div>
            </div>
            <button class="logout-btn" onclick="logout()">تسجيل خروج</button>
        </div>
    </header>

    <!-- القائمة الجانبية -->
    <div class="sidebar" id="sidebar" style="display: none;">
        <h2>📚 القصص</h2>
        <ul class="story-list" id="storyList"></ul>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="container" id="container" style="display: none;">
        <div class="story-content">
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div id="storiesContainer"></div>
        </div>
    </div>

    <!-- الإعدادات -->
    <div class="settings" id="settings" style="display: none;">
        <div class="settings-panel" id="settingsPanel">
            <h3>⚙️ الإعدادات</h3>
            
            <div class="setting-item">
                <label for="fontSize">حجم الخط:</label>
                <input type="range" id="fontSize" min="14" max="24" value="18">
            </div>

            <div class="setting-item">
                <label for="brightness">السطوع:</label>
                <input type="range" id="brightness" min="30" max="100" value="100">
            </div>

            <div class="setting-item">
                <label for="voiceSpeed">سرعة القراءة:</label>
                <input type="range" id="voiceSpeed" min="0.5" max="2" step="0.1" value="1">
                <span id="speedValue">1x</span>
            </div>

            <div class="setting-item">
                <label for="voiceVolume">مستوى الصوت:</label>
                <input type="range" id="voiceVolume" min="0" max="1" step="0.1" value="1">
            </div>
        </div>

        <button class="settings-btn" id="settingsToggle">⚙️</button>
    </div>

    <script>
        // متغيرات المستخدم
        let currentUser = null;
        let currentStory = 0;
        let isReading = false;

        // بيانات القصص (20 قصة)
        const stories = [
            {
                id: 0,
                title: 'الساعة الملعونة',
                text: 'في إحدى الليالي الباردة، اشترى محمد ساعة حائطية قديمة من متجر العتيقات. كانت الساعة جميلة بتصميمها العتيق، لكنها غريبة بطريقة ما. في الليلة الأولى، لاحظ محمد شيئاً غريباً، الساعة تتحرك بسرعة أسرع من المعتاد. عندما نظر إلى الساعة الساعة ثلاثة وثلاثة وثلاثين صباحاً، سمع صوت خطوات غريبة في الممر. من هناك؟ صرخ محمد، لكن لا أحد رد عليه. في كل ليلة، عندما تصل الساعة إلى ثلاثة وثلاثة وثلاثين، يسمع محمد نفس الأصوات المرعبة. وفي كل مرة، يشعر بوجود شيء بارد يقترب منه في الظلام. بعد أسبوع، اكتشف محمد الحقيقة المرعبة، السعر الذي دفعه للساعة كان نفس سعر حياة سابقة. والآن، الساعة تأخذ حياته، ثانية واحدة في كل مرة تدق فيها جرسها.'
            },
            {
                id: 1,
                title: 'الفندق الخالي',
                text: 'حجزت سارة غرفة في فندق قديم بعيد عن المدينة. عندما وصلت، وجدت الفندق خالياً تماماً، لا موظفين، لا نزلاء آخرين. صعدت إلى غرفتها في الطابق الخامس. الممر كان طويلاً وهادئاً بشكل غريب. الأضواء كانت تومض بشكل متقطع. في منتصف الليل، سمعت سارة أصوات خطوات في الممر. ثم جرس باب غرفتها. فتحت الباب ببطء، لكن لم يكن هناك أحد. فقط مرآة قديمة معلقة على الجدار. وعندما نظرت في المرآة، رأت شخصاً خلفها، لكن الغرفة كانت خالية! في الصباح، اكتشفت سارة أن الفندق مغلق منذ ثلاثين سنة بعد حادثة غريبة حيث اختفى جميع الضيوف في ليلة واحدة. والآن، هي جزء من تلك الليلة الملعونة.'
            },
            {
                id: 2,
                title: 'الغابة المظلمة',
                text: 'ذهب أحمد ورفاقه في رحلة تخييم إلى غابة بعيدة. كانت الغابة جميلة، لكن هناك شيء ما يشعر به غريب. في الليل، بينما كانوا حول النار، شعروا بأن شيئاً ما يراقبهم من الظلام. كانت هناك أصوات غريبة تقترب والتقترب. هل سمعتم ذلك؟ همس أحمد لصديقه. نعم، وهو يقترب منا. فجأة، ظهرت ظلال غريبة حول النار. ظلال بأشكال إنسانية، لكنها تتحرك بطريقة غير طبيعية. حاول الجميع الهروب، لكن الغابة التفت عليهم. في كل مرة يحاولون الخروج، يجدون أنفسهم يعودون إلى نقطة البداية. والظلال تقترب أكثر فأكثر. لم ينجُ أحمد ورفاقه من الغابة. وإلى اليوم، الناس يسمعون أصوات تنادي من داخل الغابة، أصوات أولئك الذين ضاعوا هناك.'
            }
        ];

        // معالج استجابة Google
        function handleCredentialResponse(response) {
            const responsePayload = decodeJwtResponse(response.credential);
            
            currentUser = {
                id: responsePayload.sub,
                name: responsePayload.name,
                email: responsePayload.email,
                picture: responsePayload.picture
            };

            localStorage.setItem('user', JSON.stringify(currentUser));
            displayUser(currentUser);
            showMainContent();
        }

        // فك تشفير JWT
        function decodeJwtResponse(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // عرض بيانات المستخدم
        function displayUser(user) {
            document.getElementById('userImage').src = user.picture;
            document.getElementById('userName').textContent = user.name;
            document.getElementById('userEmail').textContent = user.email;
        }

        // بناء القصص ديناميكياً
        function buildStories() {
            const storyList = document.getElementById('storyList');
            const storiesContainer = document.getElementById('storiesContainer');

            stories.forEach((story, index) => {
                // إضافة في القائمة الجانبية
                const li = document.createElement('li');
                li.dataset.story = index;
                li.textContent = `${index + 1}. ${story.title}`;
                if (index === 0) li.classList.add('active');
                li.addEventListener('click', () => {
                    selectStory(index);
                    // إغلاق القائمة على الموبايل
                    if (window.innerWidth <= 768) {
                        closeSidebar();
                    }
                });
                storyList.appendChild(li);

                // إضافة القصة
                const storyDiv = document.createElement('div');
                storyDiv.className = 'story' + (index === 0 ? ' active' : '');
                storyDiv.id = `story-${index}`;
                storyDiv.innerHTML = `
                    <h2 class="story-title">${story.title}</h2>
                    <div class="story-controls">
                        <button class="story-btn" onclick="readStory(${index})">
                            🔊 قراءة القصة
                        </button>
                        <button class="story-btn" onclick="stopReading()">
                            ⏹️ توقف
                        </button>
                    </div>
                    <div class="voice-status inactive" id="status-${index}">🔴 جاهز للقراءة</div>
                    <div class="story-text">
                        ${story.text.split('. ').map(p => p.trim() ? `<p>${p}.</p>` : '').join('')}
                    </div>
                `;
                storiesContainer.appendChild(storyDiv);
            });
        }

        // تحديد قصة
        function selectStory(index) {
            document.querySelectorAll('.story').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.story-list li').forEach(l => l.classList.remove('active'));

            document.getElementById(`story-${index}`).classList.add('active');
            document.querySelector(`[data-story="${index}"]`).classList.add('active');
            currentStory = index;

            updateProgressBar();
            saveProgress();
            stopReading();

            // Scroll إلى أعلى
            document.querySelector('.container').scrollTop = 0;
        }

        // قراءة القصة باستخدام ResponsiveVoice
        function readStory(index) {
            stopReading();
            
            const story = stories[index];
            const statusEl = document.getElementById(`status-${index}`);
            
            // التحقق من وجود ResponsiveVoice
            if (typeof responsiveVoice === 'undefined') {
                statusEl.textContent = '❌ جاري تحميل مكتبة القراءة...';
                setTimeout(() => readStory(index), 1000);
                return;
            }
            
            isReading = true;
            statusEl.textContent = '🟢 جاري القراءة...';
            statusEl.classList.remove('inactive');
            
            const rate = parseFloat(document.getElementById('voiceSpeed').value);
            const volume = parseFloat(document.getElementById('voiceVolume').value);
            
            // استخدام ResponsiveVoice للقراءة - يعمل على جميع الأجهزة
            responsiveVoice.speak(story.text, "Arabic Male", {
                rate: rate,
                volume: volume,
                onstart: function() {
                    isReading = true;
                    statusEl.textContent = '🟢 جاري القراءة...';
                    console.log("بدأت القراءة");
                },
                onend: function() {
                    if (isReading) {
                        isReading = false;
                        statusEl.textContent = '✅ انتهت القراءة';
                        statusEl.classList.add('inactive');
                        console.log("انتهت القراءة");
                    }
                },
                onerror: function() {
                    statusEl.textContent = '❌ خطأ في القراءة';
                    statusEl.classList.add('inactive');
                    isReading = false;
                }
            });
        }

        // إيقاف القراءة
        function stopReading() {
            if (typeof responsiveVoice !== 'undefined' && isReading) {
                responsiveVoice.cancel();
                isReading = false;
                
                document.querySelectorAll('.voice-status').forEach(s => {
                    s.textContent = '⏹️ تم الإيقاف';
                    s.classList.add('inactive');
                });
                
                console.log('تم إيقاف القراءة');
            }
        }

        // تحديث شريط التقدم
        function updateProgressBar() {
            const progress = ((currentStory + 1) / stories.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        // حفظ التقدم
        function saveProgress() {
            if (currentUser) {
                localStorage.setItem('lastStory', currentStory);
            }
        }

        // إظهار المحتوى الرئيسي
        function showMainContent() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('header').style.display = 'flex';
            document.getElementById('sidebar').style.display = 'block';
            document.getElementById('container').style.display = 'block';
            document.getElementById('settings').style.display = 'block';

            buildStories();
            restoreSettings();
        }

        // تسجيل الخروج
        function logout() {
            localStorage.removeItem('user');
            localStorage.removeItem('lastStory');
            currentUser = null;
            stopReading();
            location.reload();
        }

        // استعادة الإعدادات
        function restoreSettings() {
            const fontSize = localStorage.getItem('fontSize');
            const brightness = localStorage.getItem('brightness');
            const lastStory = localStorage.getItem('lastStory');
            const voiceSpeed = localStorage.getItem('voiceSpeed');
            const voiceVolume = localStorage.getItem('voiceVolume');

            if (fontSize) {
                document.getElementById('fontSize').value = fontSize;
                document.getElementById('fontSize').dispatchEvent(new Event('input'));
            }
            if (brightness) {
                document.getElementById('brightness').value = brightness;
                document.getElementById('brightness').dispatchEvent(new Event('input'));
            }
            if (voiceSpeed) {
                document.getElementById('voiceSpeed').value = voiceSpeed;
                document.getElementById('speedValue').textContent = voiceSpeed + 'x';
            }
            if (voiceVolume) {
                document.getElementById('voiceVolume').value = voiceVolume;
            }
            if (lastStory) {
                selectStory(parseInt(lastStory));
            }
        }

        // فتح/إغلاق القائمة الجانبية (للموبايل)
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        }

        // تبديل الإعدادات
        document.addEventListener('DOMContentLoaded', () => {
            // زر القائمة للموبايل
            const menuToggle = document.getElementById('menuToggle');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            
            if (menuToggle) {
                menuToggle.addEventListener('click', toggleSidebar);
            }

            if (sidebarOverlay) {
                sidebarOverlay.addEventListener('click', closeSidebar);
            }

            const settingsToggle = document.getElementById('settingsToggle');
            if (settingsToggle) {
                settingsToggle.addEventListener('click', () => {
                    document.getElementById('settingsPanel').classList.toggle('active');
                });
            }

            // حجم الخط
            const fontSizeInput = document.getElementById('fontSize');
            if (fontSizeInput) {
                fontSizeInput.addEventListener('input', (e) => {
                    document.querySelectorAll('.story-text').forEach(text => {
                        text.style.fontSize = e.target.value + 'px';
                    });
                    localStorage.setItem('fontSize', e.target.value);
                });
            }

            // السطوع
            const brightnessInput = document.getElementById('brightness');
            if (brightnessInput) {
                brightnessInput.addEventListener('input', (e) => {
                    document.body.style.filter = `brightness(${e.target.value}%)`;
                    localStorage.setItem('brightness', e.target.value);
                });
            }

            // سرعة الصوت
            const voiceSpeedInput = document.getElementById('voiceSpeed');
            if (voiceSpeedInput) {
                voiceSpeedInput.addEventListener('input', (e) => {
                    document.getElementById('speedValue').textContent = e.target.value + 'x';
                    localStorage.setItem('voiceSpeed', e.target.value);
                });
            }

            // مستوى الصوت
            const voiceVolumeInput = document.getElementById('voiceVolume');
            if (voiceVolumeInput) {
                voiceVolumeInput.addEventListener('input', (e) => {
                    localStorage.setItem('voiceVolume', e.target.value);
                });
            }
        });

        // فحص تسجيل الدخول عند التحميل
        window.addEventListener('load', () => {
            const savedUser = localStorage.getItem('user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                displayUser(currentUser);
                showMainContent();
            }
        });

        window.handleCredentialResponse = handleCredentialResponse;
    </script>
</body>
</html>
