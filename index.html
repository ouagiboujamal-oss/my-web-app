<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="قصص رعب مخيفة - تجربة قراءة صوتية تفاعلية">
    <title>قصص الرعب - هالوين المرعب 🎃</title>
    
    <!-- ✅ سكريبت AdSense الرئيسي -->

     crossorigin="anonymous"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #ff6b35;
            --secondary-color: #ff8c42;
            --dark-purple: #1a0033;
            --medium-purple: #2d1b4e;
            --light-text: #e8e8e8;
            --border-glow: rgba(255, 107, 53, 0.4);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark-purple) 0%, var(--medium-purple) 50%, var(--dark-purple) 100%);
            color: var(--light-text);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .halloween-decorations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .pumpkin, .ghost, .bat, .spider, .skull {
            position: absolute;
            font-size: 40px;
            opacity: 0.6;
        }

        .pumpkin { animation: float 6s ease-in-out infinite, rotate 8s linear infinite; }
        .ghost { animation: float 5s ease-in-out infinite, ghostMove 10s ease-in-out infinite; }
        .bat { animation: fly 4s ease-in-out infinite; }
        .spider { animation: spiderDrop 8s ease-in-out infinite; }
        .skull { animation: float 7s ease-in-out infinite, skullShake 2s ease-in-out infinite; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fly {
            0%, 100% { transform: translateX(0) translateY(0); }
            25% { transform: translateX(-30px) translateY(-15px); }
            75% { transform: translateX(30px) translateY(-15px); }
        }

        @keyframes ghostMove {
            0%, 100% { transform: translateX(0); opacity: 0.6; }
            50% { transform: translateX(-50px); opacity: 0.3; }
        }

        @keyframes spiderDrop {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(100px); }
        }

        @keyframes skullShake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            75% { transform: rotate(-5deg); }
        }

        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--dark-purple), var(--medium-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: fadeIn 0.5s ease;
        }

        .login-screen.hidden { display: none; }

        .login-container {
            background: rgba(45, 27, 78, 0.9);
            backdrop-filter: blur(15px);
            padding: 60px 50px;
            border-radius: 25px;
            border: 3px solid var(--primary-color);
            text-align: center;
            box-shadow: 0 10px 40px rgba(255, 107, 53, 0.5), 0 0 80px rgba(255, 107, 53, 0.3);
            max-width: 450px;
            width: 90%;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-container h1 {
            font-size: 48px;
            color: var(--primary-color);
            margin-bottom: 15px;
            text-shadow: 0 0 25px rgba(255, 107, 53, 0.9), 0 0 50px rgba(255, 107, 53, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .login-container p {
            color: #c0c0c0;
            margin-bottom: 35px;
            font-size: 16px;
            line-height: 1.6;
        }

        .login-container .subtitle {
            color: var(--primary-color);
            font-size: 18px;
            margin-bottom: 30px;
            font-weight: bold;
        }

        #customGoogleBtn {
            background: linear-gradient(135deg, #4285f4, #34a853);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.4);
            margin-top: 20px;
        }

        #customGoogleBtn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(66, 133, 244, 0.6);
        }

        header {
            background: rgba(26, 0, 51, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-bottom: 3px solid var(--primary-color);
            box-shadow: 0 4px 20px var(--border-glow);
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-icon {
            font-size: 50px;
            animation: pulse 2s ease-in-out infinite;
            filter: drop-shadow(0 0 10px var(--primary-color));
        }

        header h1 {
            font-size: 36px;
            color: var(--primary-color);
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.8), 0 0 40px rgba(255, 107, 53, 0.4);
            text-align: center;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 107, 53, 0.15);
            padding: 12px 25px;
            border-radius: 30px;
            border: 2px solid rgba(255, 107, 53, 0.4);
            transition: all 0.3s ease;
        }

        .user-profile:hover {
            background: rgba(255, 107, 53, 0.25);
            border-color: var(--primary-color);
            transform: scale(1.05);
            box-shadow: 0 4px 15px var(--border-glow);
        }

        .user-profile img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid var(--primary-color);
            box-shadow: 0 0 10px var(--border-glow);
        }

        .user-info { text-align: right; }

        .user-info .name {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 15px;
        }

        .user-info .email {
            color: #b0b0b0;
            font-size: 12px;
        }

        .logout-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--border-glow);
        }

        .logout-btn:hover {
            transform: scale(1.1) translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.7);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 0;
            min-height: calc(100vh - 90px);
            position: relative;
            z-index: 10;
        }

        .sidebar {
            background: rgba(26, 0, 51, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-left: 3px solid var(--border-glow);
            overflow-y: auto;
            position: sticky;
            top: 90px;
            height: calc(100vh - 90px);
        }

        .sidebar h2 {
            color: var(--primary-color);
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-glow);
            padding-bottom: 15px;
            font-size: 24px;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 107, 53, 0.5);
        }

        .story-list { list-style: none; }

        .story-list li {
            padding: 16px;
            margin: 12px 0;
            background: rgba(255, 107, 53, 0.1);
            border-right: 4px solid var(--primary-color);
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-size: 16px;
            color: var(--light-text);
            position: relative;
            overflow: hidden;
        }

        .story-list li:hover {
            background: rgba(255, 107, 53, 0.25);
            transform: translateX(10px) scale(1.03);
            box-shadow: 0 4px 15px var(--border-glow);
        }

        .story-list li.active {
            background: rgba(255, 107, 53, 0.35);
            border-right: 6px solid var(--secondary-color);
            font-weight: bold;
            box-shadow: 0 4px 20px var(--border-glow);
        }

        .content-area {
            padding: 40px;
            overflow-y: auto;
        }

        /* ✅ مساحة الإعلانات - محسّنة */
        .ad-container {
            max-width: 800px;
            margin: 0 auto 30px;
            padding: 20px;
            background: rgba(45, 27, 78, 0.4);
            border-radius: 15px;
            border: 2px solid rgba(255, 107, 53, 0.2);
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .story-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(45, 27, 78, 0.7);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 25px;
            border: 2px solid var(--border-glow);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 40px var(--border-glow);
        }

        .story { display: none; }
        .story.active { display: block; animation: fadeInUp 0.6s ease; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .story-title {
            font-size: 40px;
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 35px;
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.6), 0 0 40px rgba(255, 107, 53, 0.3);
        }

        .story-controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .story-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 17px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--border-glow);
        }

        .story-btn:hover:not(:disabled) {
            transform: translateY(-4px) scale(1.08);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.6);
        }

        .story-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .voice-status {
            text-align: center;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            background: rgba(255, 107, 53, 0.2);
            border: 2px solid var(--border-glow);
        }

        .story-text {
            line-height: 2.3;
            font-size: 19px;
            text-align: justify;
            color: var(--light-text);
        }

        .story-text p {
            margin-bottom: 20px;
            text-indent: 30px;
        }

        .progress-container {
            background: rgba(255, 255, 255, 0.1);
            height: 12px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 107, 53, 0.3);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            width: 0;
            transition: width 0.5s ease;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.7);
        }

        .story-navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 15px;
        }

        .nav-btn {
            background: rgba(255, 107, 53, 0.2);
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
            flex: 1;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--primary-color);
            color: white;
            transform: scale(1.05);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .main-layout { grid-template-columns: 1fr; }
            .content-area { padding: 20px 15px; }
            .story-container { padding: 30px 20px; }
            header { grid-template-columns: 1fr; }
            header h1 { font-size: 26px; }
        }
    </style>
</head>
<body>
    <div class="halloween-decorations" aria-hidden="true">
        <div class="pumpkin" style="top: 10%; right: 10%;">🎃</div>
        <div class="ghost" style="top: 20%; right: 80%;">👻</div>
        <div class="bat" style="top: 15%; right: 50%;">🦇</div>
        <div class="spider" style="top: 5%; right: 30%;">🕷️</div>
        <div class="skull" style="top: 25%; right: 70%;">💀</div>
    </div>

    <div class="login-screen" id="loginScreen">
        <div class="login-container">
            <h1>🎃 قصص الرعب 👻</h1>
            <p class="subtitle">أهلاً بك في عالم الرعب والغموض</p>
            <p>استعد لتجربة مرعبة لا تُنسى مع أفضل قصص الهالوين</p>
            
            <div id="g_id_onload"
                 data-client_id="295699802302-t4l7rov5vo93g20fuphhbh4sj21dbgu1.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            
            <button id="customGoogleBtn" onclick="initiateGoogleSignIn()">
                <svg width="24" height="24" viewBox="0 0 24 24">
                    <path fill="#fff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#fff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#fff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                تسجيل الدخول بحساب جوجل
            </button>
        </div>
    </div>

    <header id="header" style="display: none;">
        <div class="header-icon">🎃</div>
        <h1>قصص الرعب المرعبة 🌙</h1>
        <div class="user-profile">
            <img id="userImage" src="" alt="صورة المستخدم">
            <div class="user-info">
                <div class="name" id="userName"></div>
                <div class="email" id="userEmail"></div>
            </div>
            <button class="logout-btn" onclick="logout()">خروج</button>
        </div>
    </header>

    <div class="main-layout" id="mainLayout" style="display: none;">
        <aside class="sidebar" id="sidebar">
            <h2>📚 قائمة القصص المرعبة</h2>
            <ul class="story-list" id="storyList"></ul>
        </aside>

        <main class="content-area">
            
            <!-- ✅✅✅ الإعلان الأول - هنا بالضبط ✅✅✅ -->
            <div class="ad-container">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-6847506129570052"
                     data-ad-slot="5037307165"

                     data-full-width-responsive="true"></ins>

                     (adsbygoogle = window.adsbygoogle || []).push({});

            <div class="story-container">
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div id="storiesContainer"></div>
            </div>

            <!-- ✅✅✅ الإعلان الثاني - هنا بالضبط ✅✅✅ -->
            <div class="ad-container" style="margin-top: 30px;">
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-6847506129570052"
                     data-ad-slot="5037307165"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>
                     (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>

        </main>

    <script>
        let currentUser = null;
        let currentStory = 0;
        let isReading = false;
        let utterance = null;
        let voices = [];

        const stories = [
            {id: 0, title: '🎃 الساعة الملعونة', text: 'في إحدى الليالي الباردة، اشترى محمد ساعة حائطية قديمة من متجر العتيقات. كانت الساعة جميلة بتصميمها العتيق، لكنها غريبة بطريقة ما. في الليلة الأولى، لاحظ محمد شيئاً غريباً. الساعة تتحرك بسرعة أسرع من المعتاد.'},
            {id: 1, title: '👻 الفندق الخالي', text: 'حجزت سارة غرفة في فندق قديم بعيد عن المدينة. عندما وصلت، وجدت الفندق خالياً تماماً. لا موظفين، لا نزلاء آخرين.'},
            {id: 2, title: '🌲 الغابة المظلمة', text: 'ذهب أحمد ورفاقه في رحلة تخييم إلى غابة بعيدة. في الليل، شعروا بأن شيئاً ما يراقبهم من الظلام.'}
        ];

        function initiateGoogleSignIn() {
            alert('يرجى استبدال YOUR_GOOGLE_CLIENT_ID بمعرف العميل الحقيقي');
        }

        function handleCredentialResponse(response) {
            if (!response || !response.credential) return;
            try {
                const payload = decodeJwtResponse(response.credential);
                currentUser = {
                    id: payload.sub,
                    name: payload.name,
                    email: payload.email,
                    picture: payload.picture
                };
                localStorage.setItem('user', JSON.stringify(currentUser));
                displayUser(currentUser);
                showMainContent();
            } catch (error) {
                console.error('خطأ في تسجيل الدخول:', error);
            }
        }

        function decodeJwtResponse(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => 
                '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
            ).join(''));
            return JSON.parse(jsonPayload);
        }

        function displayUser(user) {
            document.getElementById('userImage').src = user.picture;
            document.getElementById('userName').textContent = user.name;
            document.getElementById('userEmail').textContent = user.email;
        }

        function buildStories() {
            const storyList = document.getElementById('storyList');
            const storiesContainer = document.getElementById('storiesContainer');

            stories.forEach((story, index) => {
                const li = document.createElement('li');
                li.textContent = story.title;
                if (index === 0) li.classList.add('active');
                li.onclick = () => selectStory(index);
                storyList.appendChild(li);

                const storyDiv = document.createElement('div');
                storyDiv.className = 'story' + (index === 0 ? ' active' : '');
                storyDiv.id = `story-${index}`;
                storyDiv.innerHTML = `
                    <h2 class="story-title">${story.title}</h2>
                    <div class="story-controls">
                        <button class="story-btn" onclick="readStory(${index})">🔊 قراءة القصة</button>
                        <button class="story-btn" onclick="stopReading()">⏹️ توقف</button>
                    </div>
                    <div class="voice-status" id="status-${index}">🎃 جاهز للقراءة</div>
                    <div class="story-text"><p>${story.text}</p></div>
                    <div class="story-navigation">
                        <button class="nav-btn" onclick="previousStory()" ${index === 0 ? 'disabled' : ''}>⬅️ السابقة</button>
                        <button class="nav-btn" onclick="nextStory()" ${index === stories.length - 1 ? 'disabled' : ''}>التالية ➡️</button>
                    </div>
                `;
                storiesContainer.appendChild(storyDiv);
            });
        }

        function selectStory(index) {
            document.querySelectorAll('.story').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.story-list li').forEach(l => l.classList.remove('active'));
            document.getElementById(`story-${index}`).classList.add('active');
            document.querySelectorAll('.story-list li')[index].classList.add('active');
            currentStory = index;
            updateProgressBar();
        }

        function nextStory() {
            if (currentStory < stories.length - 1) selectStory(currentStory + 1);
        }

        function previousStory() {
            if (currentStory > 0) selectStory(currentStory - 1);
        }

        function readStory(index) {
            if (!('speechSynthesis' in window)) {
                alert('المتصفح لا يدعم القراءة الصوتية');
                return;
            }
            stopReading();
            utterance = new SpeechSynthesisUtterance(stories[index].text);
            utterance.lang = 'ar-SA';
            utterance.rate = 1;
            speechSynthesis.speak(utterance);
            document.getElementById(`status-${index}`).textContent = '👻 جاري القراءة...';
        }

        function stopReading() {
            if (speechSynthesis.speaking) {
                speechSynthesis.cancel();
                document.querySelectorAll('.voice-status').forEach(s => {
                    s.textContent = '🎃 جاهز للقراءة';
                });
            }
        }

        function updateProgressBar() {
            document.getElementById('progressBar').style.width = 
                ((currentStory + 1) / stories.length) * 100 + '%';
        }

        function showMainContent() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('header').style.display = 'grid';
            document.getElementById('mainLayout').style.display = 'grid';
            buildStories();
        }

        function logout() {
            if (confirm('هل أنت متأكد؟')) {
                localStorage.removeItem('user');
                location.reload();
            }
        }

        window.addEventListener('load', () => {
            const savedUser = localStorage.getItem('user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                displayUser(currentUser);
                showMainContent();
            }
        });

        window.handleCredentialResponse = handleCredentialResponse;
        window.initiateGoogleSignIn = initiateGoogleSignIn;
        window.logout = logout;
        window.readStory = readStory;
        window.stopReading = stopReading;
        window.nextStory = nextStory;
        window.previousStory = previousStory;
    </script>
</body>
</html>
