<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="قصص رعب مخيفة - تجربة قراءة صوتية تفاعلية">
    <meta name="theme-color" content="#1a0033">
    <title>قصص الرعب - هالوين المرعب 🎃</title>
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6847506129570052"
     crossorigin="anonymous"></script>
    
    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #ff6b35;
            --secondary-color: #ff8c42;
            --dark-purple: #1a0033;
            --medium-purple: #2d1b4e;
            --light-text: #e8e8e8;
            --border-glow: rgba(255, 107, 53, 0.4);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark-purple) 0%, var(--medium-purple) 50%, var(--dark-purple) 100%);
            color: var(--light-text);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* أشكال هالوين المتحركة المحسّنة */
        .halloween-decorations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .pumpkin, .ghost, .bat, .spider, .skull {
            position: absolute;
            font-size: 40px;
            opacity: 0.6;
        }

        .pumpkin {
            animation: float 6s ease-in-out infinite, rotate 8s linear infinite;
        }

        .ghost {
            animation: float 5s ease-in-out infinite, ghostMove 10s ease-in-out infinite;
        }

        .bat {
            animation: fly 4s ease-in-out infinite;
        }

        .spider {
            animation: spiderDrop 8s ease-in-out infinite;
        }

        .skull {
            animation: float 7s ease-in-out infinite, skullShake 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fly {
            0%, 100% { transform: translateX(0) translateY(0); }
            25% { transform: translateX(-30px) translateY(-15px); }
            75% { transform: translateX(30px) translateY(-15px); }
        }

        @keyframes ghostMove {
            0%, 100% { transform: translateX(0); opacity: 0.6; }
            50% { transform: translateX(-50px); opacity: 0.3; }
        }

        @keyframes spiderDrop {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(100px); }
        }

        @keyframes skullShake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            75% { transform: rotate(-5deg); }
        }

        /* شاشة تسجيل الدخول المحسّنة */
        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--dark-purple), var(--medium-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: fadeIn 0.5s ease;
        }

        .login-screen.hidden {
            display: none;
        }

        .login-container {
            background: rgba(45, 27, 78, 0.9);
            backdrop-filter: blur(15px);
            padding: 60px 50px;
            border-radius: 25px;
            border: 3px solid var(--primary-color);
            text-align: center;
            box-shadow: 0 10px 40px rgba(255, 107, 53, 0.5), 
                        0 0 80px rgba(255, 107, 53, 0.3);
            max-width: 450px;
            width: 90%;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-container h1 {
            font-size: 48px;
            color: var(--primary-color);
            margin-bottom: 15px;
            text-shadow: 0 0 25px rgba(255, 107, 53, 0.9),
                         0 0 50px rgba(255, 107, 53, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .login-container p {
            color: #c0c0c0;
            margin-bottom: 35px;
            font-size: 16px;
            line-height: 1.6;
        }

        .login-container .subtitle {
            color: var(--primary-color);
            font-size: 18px;
            margin-bottom: 30px;
            font-weight: bold;
        }

        /* زر تسجيل الدخول بجوجل المخصص */
        #customGoogleBtn {
            background: linear-gradient(135deg, #4285f4, #34a853);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.4);
            margin-top: 20px;
        }

        #customGoogleBtn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(66, 133, 244, 0.6);
        }

        #customGoogleBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #customGoogleBtn svg {
            width: 24px;
            height: 24px;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* الشريط العلوي المحسّن */
        header {
            background: rgba(26, 0, 51, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-bottom: 3px solid var(--primary-color);
            box-shadow: 0 4px 20px var(--border-glow);
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-icon {
            font-size: 50px;
            animation: pulse 2s ease-in-out infinite;
            filter: drop-shadow(0 0 10px var(--primary-color));
        }

        header h1 {
            font-size: 36px;
            color: var(--primary-color);
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.8),
                         0 0 40px rgba(255, 107, 53, 0.4);
            text-align: center;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 107, 53, 0.15);
            padding: 12px 25px;
            border-radius: 30px;
            border: 2px solid rgba(255, 107, 53, 0.4);
            transition: all 0.3s ease;
        }

        .user-profile:hover {
            background: rgba(255, 107, 53, 0.25);
            border-color: var(--primary-color);
            transform: scale(1.05);
            box-shadow: 0 4px 15px var(--border-glow);
        }

        .user-profile img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid var(--primary-color);
            box-shadow: 0 0 10px var(--border-glow);
        }

        .user-info {
            text-align: right;
        }

        .user-info .name {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 15px;
        }

        .user-info .email {
            color: #b0b0b0;
            font-size: 12px;
        }

        .logout-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--border-glow);
        }

        .logout-btn:hover {
            transform: scale(1.1) translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.7);
        }

        /* زر القائمة للموبايل */
        .menu-toggle {
            display: none;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: white;
            font-size: 28px;
            padding: 15px 20px;
            border-radius: 15px;
            cursor: pointer;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            box-shadow: 0 4px 15px var(--border-glow);
            transition: all 0.3s ease;
        }

        .menu-toggle:hover {
            transform: scale(1.15) rotate(90deg);
        }

        /* overlay للموبايل */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 999;
            backdrop-filter: blur(5px);
        }

        .sidebar-overlay.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* التخطيط الرئيسي */
        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 0;
            min-height: calc(100vh - 90px);
            position: relative;
            z-index: 10;
        }

        /* القائمة الجانبية المحسّنة */
        .sidebar {
            background: rgba(26, 0, 51, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-left: 3px solid var(--border-glow);
            overflow-y: auto;
            position: sticky;
            top: 90px;
            height: calc(100vh - 90px);
        }

        .sidebar::-webkit-scrollbar {
            width: 10px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: rgba(255, 107, 53, 0.1);
            border-radius: 5px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--primary-color), var(--secondary-color));
            border-radius: 5px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover {
            background: var(--primary-color);
        }

        .sidebar h2 {
            color: var(--primary-color);
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-glow);
            padding-bottom: 15px;
            font-size: 24px;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 107, 53, 0.5);
        }

        .story-list {
            list-style: none;
        }

        .story-list li {
            padding: 16px;
            margin: 12px 0;
            background: rgba(255, 107, 53, 0.1);
            border-right: 4px solid var(--primary-color);
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-size: 16px;
            color: var(--light-text);
            position: relative;
            overflow: hidden;
        }

        .story-list li::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 100%;
            background: rgba(255, 107, 53, 0.2);
            transition: width 0.3s ease;
            z-index: -1;
        }

        .story-list li:hover::before {
            width: 100%;
        }

        .story-list li:hover {
            background: rgba(255, 107, 53, 0.25);
            transform: translateX(10px) scale(1.03);
            box-shadow: 0 4px 15px var(--border-glow);
        }

        .story-list li.active {
            background: rgba(255, 107, 53, 0.35);
            border-right: 6px solid var(--secondary-color);
            font-weight: bold;
            box-shadow: 0 4px 20px var(--border-glow);
        }

        /* المحتوى الرئيسي */
        .content-area {
            padding: 40px;
            overflow-y: auto;
        }

        /* مساحة الإعلانات */
        .ad-container {
            max-width: 800px;
            margin: 0 auto 30px;
            padding: 20px;
            background: rgba(45, 27, 78, 0.4);
            border-radius: 15px;
            border: 2px solid rgba(255, 107, 53, 0.2);
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .story-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(45, 27, 78, 0.7);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 25px;
            border: 2px solid var(--border-glow);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),
                        0 0 40px var(--border-glow);
        }

        .story {
            display: none;
        }

        .story.active {
            display: block;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .story-title {
            font-size: 40px;
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 35px;
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.6),
                         0 0 40px rgba(255, 107, 53, 0.3);
        }

        .story-controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .story-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 17px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--border-glow);
            position: relative;
            overflow: hidden;
        }

        .story-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .story-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .story-btn:hover:not(:disabled) {
            transform: translateY(-4px) scale(1.08);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.6);
        }

        .story-btn:active {
            transform: translateY(-2px) scale(1.05);
        }

        .story-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .voice-status {
            text-align: center;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            background: rgba(255, 107, 53, 0.2);
            border: 2px solid var(--border-glow);
            transition: all 0.3s ease;
        }

        .voice-status.inactive {
            opacity: 0.6;
        }

        .voice-status.active {
            animation: statusPulse 1.5s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% { box-shadow: 0 0 10px var(--border-glow); }
            50% { box-shadow: 0 0 25px rgba(255, 107, 53, 0.8); }
        }

        .story-text {
            line-height: 2.3;
            font-size: 19px;
            text-align: justify;
            color: var(--light-text);
        }

        .story-text p {
            margin-bottom: 20px;
            text-indent: 30px;
        }

        /* شريط التقدم المحسّن */
        .progress-container {
            background: rgba(255, 255, 255, 0.1);
            height: 12px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 107, 53, 0.3);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            width: 0;
            transition: width 0.5s ease;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.7);
            position: relative;
            overflow: hidden;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* الإعدادات المحسّنة */
        .settings {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 500;
        }

        .settings-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 30px;
            box-shadow: 0 6px 20px var(--border-glow);
            transition: all 0.3s ease;
        }

        .settings-btn:hover {
            transform: rotate(180deg) scale(1.2);
            box-shadow: 0 8px 30px rgba(255, 107, 53, 0.8);
        }

        .settings-panel {
            position: fixed;
            bottom: 100px;
            left: 30px;
            background: rgba(26, 0, 51, 0.95);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 25px;
            border: 2px solid var(--border-glow);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            width: 340px;
            display: none;
        }

        .settings-panel.active {
            display: block;
            animation: slideUpSettings 0.4s ease;
        }

        @keyframes slideUpSettings {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .settings-panel h3 {
            color: var(--primary-color);
            margin-bottom: 25px;
            text-align: center;
            font-size: 24px;
            text-shadow: 0 0 15px rgba(255, 107, 53, 0.5);
        }

        .setting-item {
            margin-bottom: 20px;
        }

        .setting-item label {
            display: block;
            color: #c0c0c0;
            font-size: 15px;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .setting-item input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: rgba(255, 107, 53, 0.2);
            outline: none;
            cursor: pointer;
        }

        .setting-item input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            box-shadow: 0 0 10px var(--border-glow);
        }

        .setting-item input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            box-shadow: 0 0 10px var(--border-glow);
        }

        .setting-item span {
            color: var(--primary-color);
            font-weight: bold;
            margin-right: 10px;
            font-size: 16px;
        }

        /* أزرار التنقل بين القصص */
        .story-navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 15px;
        }

        .nav-btn {
            background: rgba(255, 107, 53, 0.2);
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
            flex: 1;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--primary-color);
            color: white;
            transform: scale(1.05);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* تصميم متجاوب للموبايل */
        @media (max-width: 768px) {
            header {
                grid-template-columns: 1fr;
                padding: 15px;
            }

            .header-icon {
                display: none;
            }

            header h1 {
                font-size: 26px;
            }

            .user-profile {
                display: none;
            }

            .menu-toggle {
                display: block;
            }

            .main-layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: fixed;
                top: 0;
                right: 0;
                height: 100vh;
                width: 85%;
                max-width: 350px;
                transform: translateX(100%);
                transition: transform 0.3s ease;
                z-index: 1000;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .content-area {
                padding: 20px 15px;
            }

            .story-container {
                padding: 30px 20px;
            }

            .story-title {
                font-size: 28px;
            }

            .story-text {
                font-size: 17px;
                line-height: 2.1;
            }

            .story-controls {
                flex-direction: column;
                gap: 12px;
            }

            .story-btn {
                width: 100%;
                padding: 16px;
            }

            .story-navigation {
                flex-direction: column;
            }

            .settings {
                bottom: 20px;
                left: 20px;
            }

            .settings-panel {
                left: 50%;
                transform: translateX(-50%);
                width: 90%;
                max-width: 340px;
                bottom: 90px;
            }

            .settings-panel.active {
                left: 50%;
                transform: translateX(-50%);
            }

            .ad-container {
                margin: 0 auto 20px;
                padding: 15px;
            }

            .login-container {
                padding: 40px 30px;
            }

            .login-container h1 {
                font-size: 38px;
            }
        }

        /* تحسين أداء الأنيميشن */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <!-- أشكال هالوين المتحركة -->
    <div class="halloween-decorations" aria-hidden="true">
        <div class="pumpkin" style="top: 10%; right: 10%;">🎃</div>
        <div class="ghost" style="top: 20%; right: 80%;">👻</div>
        <div class="bat" style="top: 15%; right: 50%;">🦇</div>

                    <path fill="#fff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>

    <script>
        // متغيرات عامة
        let currentUser = null;
        let currentStory = 0;
        let isReading = false;
        let utterance = null;
        let voices = [];

        // قصص الرعب (مختصرة - أضف المزيد حسب الحاجة)
        const stories = [
            {id: 0, title: '🎃 الساعة الملعونة', text: 'في إحدى الليالي الباردة، اشترى محمد ساعة حائطية قديمة من متجر العتيقات. كانت الساعة جميلة بتصميمها العتيق، لكنها غريبة بطريقة ما. في الليلة الأولى، لاحظ محمد شيئاً غريباً. الساعة تتحرك بسرعة أسرع من المعتاد. عندما أصبحت الساعة الثالثة والثلاثين دقيقة صباحاً، سمع صوت خطوات غريبة في الممر. من هناك؟ صرخ محمد، لكن لا أحد رد عليه.'},
            {id: 1, title: '👻 الفندق الخالي', text: 'حجزت سارة غرفة في فندق قديم بعيد عن المدينة. عندما وصلت، وجدت الفندق خالياً تماماً. لا موظفين، لا نزلاء آخرين. صعدت إلى غرفتها في الطابق الخامس. الممر كان طويلاً وهادئاً بشكل غريب.'},
            {id: 2, title: '🌲 الغابة المظلمة', text: 'ذهب أحمد ورفاقه في رحلة تخييم إلى غابة بعيدة. في الليل، شعروا بأن شيئاً ما يراقبهم من الظلام. ظهرت ظلال غريبة حول النار.'}
        ];

        // ✅ إدارة الأخطاء المحسّنة
        function showError(message) {
            const errorEl = document.getElementById('loginError');
            if (errorEl) {
                errorEl.textContent = message;
                errorEl.classList.add('show');
                setTimeout(() => errorEl.classList.remove('show'), 5000);
            }
        }

        // ✅ Google Sign-In المحسّن
        function initiateGoogleSignIn() {
            const clientId = document.getElementById('g_id_onload')?.getAttribute('data-client_id');
            
            if (!clientId || clientId === 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com') {
                showError('⚠️ خطأ في الإعداد: يجب تكوين Google Client ID أولاً.\n\nيرجى استبدال YOUR_GOOGLE_CLIENT_ID في الكود بمعرف العميل الحقيقي من:\nhttps://console.cloud.google.com/');
                return;
            }

            // محاولة تشغيل تسجيل الدخول
            if (window.google?.accounts?.id) {
                try {
                    google.accounts.id.prompt();
                } catch (error) {
                    console.error('خطأ في تسجيل الدخول:', error);
                    showError('حدث خطأ أثناء تسجيل الدخول. يرجى المحاولة مرة أخرى.');
                }
            } else {
                showError('لم يتم تحميل مكتبة Google Sign-In بشكل صحيح.');
            }
        }

        // ✅ معالجة تسجيل الدخول مع إدارة الأخطاء
        function handleCredentialResponse(response) {
            if (!response || !response.credential) {
                showError('فشل تسجيل الدخول. يرجى المحاولة مرة أخرى.');
                return;
            }

            try {
                const responsePayload = decodeJwtResponse(response.credential);
                
                // التحقق من صحة البيانات
                if (!responsePayload || !responsePayload.sub || !responsePayload.email) {
                    throw new Error('بيانات غير صحيحة');
                }

                currentUser = {
                    id: responsePayload.sub,
                    name: responsePayload.name || 'مستخدم',
                    email: responsePayload.email,
                    picture: responsePayload.picture || ''
                };

                // حفظ البيانات بشكل آمن
                try {
                    localStorage.setItem('user', JSON.stringify(currentUser));
                } catch (storageError) {
                    console.warn('تعذر حفظ البيانات في التخزين المحلي:', storageError);
                }

                displayUser(currentUser);
                showMainContent();
            } catch (error) {
                console.error('خطأ في معالجة بيانات تسجيل الدخول:', error);
                showError('حدث خطأ أثناء معالجة بيانات تسجيل الدخول');
            }
        }

        // ✅ فك تشفير JWT مع معالجة الأخطاء
        function decodeJwtResponse(token) {
            try {
                const base64Url = token.split('.')[1];
                if (!base64Url) throw new Error('رمز غير صالح');
                
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(
                    atob(base64)
                        .split('')
                        .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
                        .join('')
                );
                
                return JSON.parse(jsonPayload);
            } catch (error) {
                console.error('خطأ في فك تشفير الرمز:', error);
                throw new Error('فشل فك تشفير بيانات المصادقة');
            }
        }

        function displayUser(user) {
            const userImage = document.getElementById('userImage');
            const userName = document.getElementById('userName');
            const userEmail = document.getElementById('userEmail');

            if (userImage && user.picture) {
                userImage.src = user.picture;
                userImage.onerror = () => {
                    userImage.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50"><circle cx="25" cy="25" r="25" fill="%23ff6b35"/><text x="50%" y="50%" text-anchor="middle" dy=".3em" fill="white" font-size="20">👤</text></svg>';
                };
            }
            if (userName) userName.textContent = user.name || 'مستخدم';
            if (userEmail) userEmail.textContent = user.email || '';
        }

        function buildStories() {
            const storyList = document.getElementById('storyList');
            const storiesContainer = document.getElementById('storiesContainer');

            if (!storyList || !storiesContainer) return;

            stories.forEach((story, index) => {
                // إنشاء عنصر القائمة
                const li = document.createElement('li');
                li.dataset.story = index;
                li.textContent = story.title;
                li.setAttribute('role', 'button');
                li.setAttribute('tabindex', '0');
                if (index === 0) li.classList.add('active');
                
                li.addEventListener('click', () => {
                    selectStory(index);
                    if (window.innerWidth <= 768) closeSidebar();
                });

                // دعم لوحة المفاتيح
                li.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        selectStory(index);
                        if (window.innerWidth <= 768) closeSidebar();
                    }
                });

                storyList.appendChild(li);

                // إنشاء محتوى القصة
                const storyDiv = document.createElement('div');
                storyDiv.className = 'story' + (index === 0 ? ' active' : '');
                storyDiv.id = `story-${index}`;
                storyDiv.innerHTML = `
                    <h2 class="story-title">${story.title}</h2>
                    <div class="story-controls">
                        <button class="story-btn" id="playBtn-${index}" onclick="readStory(${index})">🔊 قراءة القصة</button>
                        <button class="story-btn" id="stopBtn-${index}" onclick="stopReading()">⏹️ توقف</button>
                    </div>
                    <div class="voice-status inactive" id="status-${index}">🎃 جاهز للقراءة</div>
                    <div class="story-text">${story.text.split('. ').filter(p => p.trim()).map(p => `<p>${p}.</p>`).join('')}</div>
                    <div class="story-navigation">
                        <button class="nav-btn" onclick="previousStory()" ${index === 0 ? 'disabled' : ''}>⬅️ القصة السابقة</button>
                        <button class="nav-btn" onclick="nextStory()" ${index === stories.length - 1 ? 'disabled' : ''}>القصة التالية ➡️</button>
                    </div>
                `;
                storiesContainer.appendChild(storyDiv);
            });
            
            loadVoices();
        }

        function selectStory(index) {
            if (index < 0 || index >= stories.length) return;

            document.querySelectorAll('.story').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.story-list li').forEach(l => l.classList.remove('active'));
            
            const storyEl = document.getElementById(`story-${index}`);
            const listItem = document.querySelector(`[data-story="${index}"]`);
            
            if (storyEl) storyEl.classList.add('active');
            if (listItem) listItem.classList.add('active');
            
            currentStory = index;
            updateProgressBar();
            saveProgress();
            stopReading();
            
            const contentArea = document.querySelector('.content-area');
            if (contentArea) contentArea.scrollTop = 0;
        }

        function nextStory() {
            if (currentStory < stories.length - 1) selectStory(currentStory + 1);
        }

        function previousStory() {
            if (currentStory > 0) selectStory(currentStory - 1);
        }

        function loadVoices() {
            if ('speechSynthesis' in window) {
                voices = speechSynthesis.getVoices();
                speechSynthesis.onvoiceschanged = () => {
                    voices = speechSynthesis.getVoices();
                };
            }
        }

        function readStory(index) {
            if (index < 0 || index >= stories.length) return;

            stopReading();
            
            const story = stories[index];
            const statusEl = document.getElementById(`status-${index}`);
            const playBtn = document.getElementById(`playBtn-${index}`);
            
            if (!statusEl || !playBtn) return;

            if (!('speechSynthesis' in window)) {
                statusEl.textContent = '❌ المتصفح لا يدعم القراءة الصوتية';
                statusEl.classList.add('inactive');
                return;
            }
            
            isReading = true;
            playBtn.disabled = true;
            statusEl.textContent = '⏳ جاري التحضير...';
            statusEl.classList.remove('inactive');
            statusEl.classList.add('active');
            
            try {
                utterance = new SpeechSynthesisUtterance(story.text);
                
                // محاولة إيجاد صوت عربي
                const arabicVoice = voices.find(v => v.lang && v.lang.startsWith('ar'));
                if (arabicVoice) utterance.voice = arabicVoice;
                
                utterance.lang = 'ar-SA';
                utterance.rate = parseFloat(document.getElementById('voiceSpeed')?.value || '1');
                utterance.volume = parseFloat(document.getElementById('voiceVolume')?.value || '1');
                utterance.pitch = parseFloat(document.getElementById('voicePitch')?.value || '1');
                
                utterance.onstart = () => {
                    isReading = true;
                    if (statusEl) statusEl.textContent = '👻 جاري القراءة...';
                };
                
                utterance.onend = () => {
                    if (isReading) {
                        isReading = false;
                        if (statusEl) {
                            statusEl.textContent = '✅ انتهت القراءة';
                            statusEl.classList.add('inactive');
                            statusEl.classList.remove('active');
                        }
                        if (playBtn) playBtn.disabled = false;
                    }
                };
                
                utterance.onerror = (event) => {
                    console.error('خطأ في القراءة الصوتية:', event);
                    if (statusEl) {
                        statusEl.textContent = '❌ خطأ في القراءة';
                        statusEl.classList.add('inactive');
                        statusEl.classList.remove('active');
                    }
                    if (playBtn) playBtn.disabled = false;
                    isReading = false;
                };
                
                speechSynthesis.cancel();
                speechSynthesis.speak(utterance);
            } catch (error) {
                console.error('فشل تشغيل القراءة الصوتية:', error);
                if (statusEl) statusEl.textContent = '❌ فشل التشغيل';
                if (playBtn) playBtn.disabled = false;
                isReading = false;
            }
        }

        function stopReading() {
            if (isReading || (speechSynthesis && speechSynthesis.speaking)) {
                try {
                    speechSynthesis.cancel();
                } catch (error) {
                    console.error('خطأ في إيقاف القراءة:', error);
                }
                
                isReading = false;
                
                document.querySelectorAll('.voice-status').forEach(s => {
                    s.textContent = '⏹️ تم الإيقاف';
                    s.classList.add('inactive');
                    s.classList.remove('active');
                });
                
                document.querySelectorAll('[id^="playBtn-"]').forEach(btn => {
                    btn.disabled = false;
                });
            }
        }

        function updateProgressBar() {
            const progressBar = document.getElementById('progressBar');
            if (progressBar && stories.length > 0) {
                progressBar.style.width = ((currentStory + 1) / stories.length) * 100 + '%';
            }
        }

        function saveProgress() {
            if (currentUser) {
                try {
                    localStorage.setItem('lastStory', currentStory.toString());
                } catch (error) {
                    console.warn('تعذر حفظ التقدم:', error);
                }
            }
        }

        function showMainContent() {
            const loginScreen = document.getElementById('loginScreen');
            const header = document.getElementById('header');
            const mainLayout = document.getElementById('mainLayout');
            const settings = document.getElementById('settings');

            if (loginScreen) loginScreen.classList.add('hidden');
            if (header) header.style.display = 'grid';
            if (mainLayout) mainLayout.style.display = 'grid';
            if (settings) settings.style.display = 'block';
            
            buildStories();
            restoreSettings();
            
            // تحميل الإعلانات
            try {
                if (window.adsbygoogle) {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                    (adsbygoogle = window.adsbygoogle || []).push({});
                }
            } catch (e) {
                console.warn('لم يتم تحميل الإعلانات:', e);
            }
        }

        function logout() {
            if (confirm('هل أنت متأكد أنك تريد تسجيل الخروج؟')) {
                try {
                    localStorage.removeItem('user');
                    localStorage.removeItem('lastStory');
                } catch (error) {
                    console.warn('خطأ في حذف البيانات:', error);
                }
                
                currentUser = null;
                stopReading();
                location.reload();
            }
        }

        function restoreSettings() {
            const defaultSettings = {
                fontSize: '19',
                brightness: '100',
                voiceSpeed: '1',
                voiceVolume: '1',
                voicePitch: '1',
                lastStory: '0'
            };

            let settings = {};
            try {
                settings = {
                    fontSize: localStorage.getItem('fontSize') || defaultSettings.fontSize,
                    brightness: localStorage.getItem('brightness') || defaultSettings.brightness,
                    voiceSpeed: localStorage.getItem('voiceSpeed') || defaultSettings.voiceSpeed,
                    voiceVolume: localStorage.getItem('voiceVolume') || defaultSettings.voiceVolume,
                    voicePitch: localStorage.getItem('voicePitch') || defaultSettings.voicePitch,
                    lastStory: localStorage.getItem('lastStory') || defaultSettings.lastStory
                };
            } catch (error) {
                console.warn('خطأ في قراءة الإعدادات:', error);
                settings = defaultSettings;
            }

            // تطبيق الإعدادات
            const fontSizeEl = document.getElementById('fontSize');
            const fontSizeValueEl = document.getElementById('fontSizeValue');
            if (fontSizeEl && fontSizeValueEl) {
                fontSizeEl.value = settings.fontSize;
                fontSizeValueEl.textContent = settings.fontSize + 'px';
                document.querySelectorAll('.story-text').forEach(text => {
                    text.style.fontSize = settings.fontSize + 'px';
                });
            }

            const brightnessEl = document.getElementById('brightness');
            const brightnessValueEl = document.getElementById('brightnessValue');
            if (brightnessEl && brightnessValueEl) {
                brightnessEl.value = settings.brightness;
                brightnessValueEl.textContent = settings.brightness + '%';
                document.body.style.filter = `brightness(${settings.brightness}%)`;
            }

            const voiceSpeedEl = document.getElementById('voiceSpeed');
            const speedValueEl = document.getElementById('speedValue');
            if (voiceSpeedEl && speedValueEl) {
                voiceSpeedEl.value = settings.voiceSpeed;
                speedValueEl.textContent = settings.voiceSpeed + 'x';
            }

            const voiceVolumeEl = document.getElementById('voiceVolume');
            const volumeValueEl = document.getElementById('volumeValue');
            if (voiceVolumeEl && volumeValueEl) {
                voiceVolumeEl.value = settings.voiceVolume;
                volumeValueEl.textContent = Math.round(parseFloat(settings.voiceVolume) * 100) + '%';
            }

            const voicePitchEl = document.getElementById('voicePitch');
            const pitchValueEl = document.getElementById('pitchValue');
            if (voicePitchEl && pitchValueEl) {
                voicePitchEl.value = settings.voicePitch;
                pitchValueEl.textContent = settings.voicePitch + 'x';
            }

            // استعادة آخر قصة
            const lastStory = parseInt(settings.lastStory);
            if (!isNaN(lastStory) && lastStory >= 0 && lastStory < stories.length) {
                selectStory(lastStory);
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar) sidebar.classList.toggle('active');
            if (overlay) overlay.classList.toggle('active');
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar) sidebar.classList.remove('active');
            if (overlay) overlay.classList.remove('active');
        }

        // ✅ تهيئة التطبيق عند تحميل DOM
        document.addEventListener('DOMContentLoaded', () => {
            const settingsToggle = document.getElementById('settingsToggle');
            const settingsPanel = document.getElementById('settingsPanel');
            const settingsContainer = document.getElementById('settings');
            
            if (settingsToggle && settingsPanel) {
                settingsToggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    settingsPanel.classList.toggle('active');
                });
            }
            
            if (settingsContainer && settingsPanel) {
                settingsContainer.addEventListener('mouseleave', () => {
                    settingsPanel.classList.remove('active');
                });
            }
            
            const menuToggle = document.getElementById('menuToggle');
            if (menuToggle) {
                menuToggle.addEventListener('click', toggleSidebar);
            }

            const sidebarOverlay = document.getElementById('sidebarOverlay');
            if (sidebarOverlay) {
                sidebarOverlay.addEventListener('click', closeSidebar);
            }

            // إعداد مستمعي الإعدادات
            ['fontSize', 'brightness', 'voiceSpeed', 'voiceVolume', 'voicePitch'].forEach(id => {
                const element = document.getElementById(id);
                if (!element) return;

                element.addEventListener('input', (e) => {
                    const value = e.target.value;
                    const valueDisplay = id + 'Value';
                    const valueEl = document.getElementById(valueDisplay);
                    
                    if (id === 'fontSize') {
                        if (valueEl) valueEl.textContent = value + 'px';
                        document.querySelectorAll('.story-text').forEach(t => {
                            t.style.fontSize = value + 'px';
                        });
                    } else if (id === 'brightness') {
                        if (valueEl) valueEl.textContent = value + '%';
                        document.body.style.filter = `brightness(${value}%)`;
                    } else if (id === 'voiceVolume') {
                        if (valueEl) valueEl.textContent = Math.round(parseFloat(value) * 100) + '%';
                    } else {
                        if (valueEl) valueEl.textContent = value + 'x';
                    }
                    
                    try {
                        localStorage.setItem(id, value);
                    } catch (error) {
                        console.warn('تعذر حفظ الإعداد:', error);
                    }
                });
            });

            // اختصارات لوحة المفاتيح
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    nextStory();
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    previousStory();
                } else if (e.key === ' ') {
                    e.preventDefault();
                    if (isReading) {
                        stopReading();
                    } else {
                        readStory(currentStory);
                    }
                } else if (e.key === 'Escape') {
                    stopReading();
                    closeSidebar();
                    const settingsPanel = document.getElementById('settingsPanel');
                    if (settingsPanel) settingsPanel.classList.remove('active');
                }
            });
        });

        // ✅ استعادة الجلسة عند التحميل
        window.addEventListener('load', () => {
            try {
                const savedUser = localStorage.getItem('user');
                if (savedUser) {
                    const parsedUser = JSON.parse(savedUser);
                    if (parsedUser && parsedUser.id && parsedUser.email) {
                        currentUser = parsedUser;
                        displayUser(currentUser);
                        showMainContent();
                    }
                }
            } catch (error) {
                console.error('خطأ في استعادة الجلسة:', error);
                localStorage.removeItem('user');
            }
        });

        // ✅ تنظيف عند مغادرة الصفحة
        window.addEventListener('beforeunload', () => {
            stopReading();
        });

        // تصدير الوظائف للنطاق العام
        window.handleCredentialResponse = handleCredentialResponse;
        window.initiateGoogleSignIn = initiateGoogleSignIn;
        window.logout = logout;
        window.readStory = readStory;
        window.stopReading = stopReading;
        window.nextStory = nextStory;
        window.previousStory = previousStory;
    </script>
</body>
</html>
