    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #ff6b35;
            --secondary-color: #ff8c42;
            --dark-purple: #1a0033;
            --medium-purple: #2d1b4e;
            --light-text: #e8e8e8;
            --border-glow: rgba(255, 107, 53, 0.4);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark-purple) 0%, var(--medium-purple) 50%, var(--dark-purple) 100%);
            color: var(--light-text);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .halloween-decorations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .pumpkin, .ghost, .bat, .spider, .skull {
            position: absolute;
            font-size: 40px;
            opacity: 0.6;
        }

        .pumpkin { animation: float 6s ease-in-out infinite, rotate 8s linear infinite; }
        .ghost { animation: float 5s ease-in-out infinite, ghostMove 10s ease-in-out infinite; }
        .bat { animation: fly 4s ease-in-out infinite; }
        .spider { animation: spiderDrop 8s ease-in-out infinite; }
        .skull { animation: float 7s ease-in-out infinite, skullShake 2s ease-in-out infinite; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fly {
            0%, 100% { transform: translateX(0) translateY(0); }
            25% { transform: translateX(-30px) translateY(-15px); }
            75% { transform: translateX(30px) translateY(-15px); }
        }

        @keyframes ghostMove {
            0%, 100% { transform: translateX(0); opacity: 0.6; }
            50% { transform: translateX(-50px); opacity: 0.3; }
        }

        @keyframes spiderDrop {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(100px); }
        }

        @keyframes skullShake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            75% { transform: rotate(-5deg); }
        }

        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--dark-purple), var(--medium-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: fadeIn 0.5s ease;
        }

        .login-screen.hidden { display: none; }

        .login-container {
            background: rgba(45, 27, 78, 0.9);
            backdrop-filter: blur(15px);
            padding: 60px 50px;
            border-radius: 25px;
            border: 3px solid var(--primary-color);
            text-align: center;
            box-shadow: 0 10px 40px rgba(255, 107, 53, 0.5), 0 0 80px rgba(255, 107, 53, 0.3);
            max-width: 450px;
            width: 90%;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .login-container h1 {
            font-size: 48px;
            color: var(--primary-color);
            margin-bottom: 15px;
            text-shadow: 0 0 25px rgba(255, 107, 53, 0.9), 0 0 50px rgba(255, 107, 53, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .login-container p {
            color: #c0c0c0;
            margin-bottom: 35px;
            font-size: 16px;
            line-height: 1.6;
        }

        .login-container .subtitle {
            color: var(--primary-color);
            font-size: 18px;
            margin-bottom: 30px;
            font-weight: bold;
        }

        #customGoogleBtn {
            background: linear-gradient(135deg, #4285f4, #34a853);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.4);
            margin-top: 20px;
        }

        #customGoogleBtn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(66, 133, 244, 0.6);
        }

        #customGoogleBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        header {
            background: rgba(26, 0, 51, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-bottom: 3px solid var(--primary-color);
            box-shadow: 0 4px 20px var(--border-glow);
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-icon {
            font-size: 50px;
            animation: pulse 2s ease-in-out infinite;
            filter: drop-shadow(0 0 10px var(--primary-color));
        }

        header h1 {
            font-size: 36px;
            color: var(--primary-color);
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.8), 0 0 40px rgba(255, 107, 53, 0.4);
            text-align: center;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 107, 53, 0.15);
            padding: 12px 25px;
            border-radius: 30px;
            border: 2px solid rgba(255, 107, 53, 0.4);
            transition: all 0.3s ease;
        }

        .user-profile:hover {
            background: rgba(255, 107, 53, 0.25);
            border-color: var(--primary-color);
            transform: scale(1.05);
            box-shadow: 0 4px 15px var(--border-glow);
        }

        .user-profile img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 3px solid var(--primary-color);
            box-shadow: 0 0 10px var(--border-glow);
        }

        .user-info { text-align: right; }

        .user-info .name {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 15px;
        }

        .user-info .email {
            color: #b0b0b0;
            font-size: 12px;
        }

        .logout-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--border-glow);
        }

        .logout-btn:hover {
            transform: scale(1.1) translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.7);
        }

        .menu-toggle {
            display: none;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: white;
            font-size: 28px;
            padding: 15px 20px;
            border-radius: 15px;
            cursor: pointer;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            box-shadow: 0 4px 15px var(--border-glow);
            transition: all 0.3s ease;
        }

        .menu-toggle:hover { transform: scale(1.15) rotate(90deg); }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 999;
            backdrop-filter: blur(5px);
        }

        .sidebar-overlay.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 0;
            min-height: calc(100vh - 90px);
            position: relative;
            z-index: 10;
        }

        .sidebar {
            background: rgba(26, 0, 51, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-left: 3px solid var(--border-glow);
            overflow-y: auto;
            position: sticky;
            top: 90px;
            height: calc(100vh - 90px);
        }

        .sidebar::-webkit-scrollbar { width: 10px; }
        .sidebar::-webkit-scrollbar-track { background: rgba(255, 107, 53, 0.1); border-radius: 5px; }
        .sidebar::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--primary-color), var(--secondary-color)); border-radius: 5px; }

        .sidebar h2 {
            color: var(--primary-color);
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-glow);
            padding-bottom: 15px;
            font-size: 24px;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 107, 53, 0.5);
        }

        .story-list { list-style: none; }

        .story-list li {
            padding: 16px;
            margin: 12px 0;
            background: rgba(255, 107, 53, 0.1);
            border-right: 4px solid var(--primary-color);
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease;
            font-size: 16px;
            color: var(--light-text);
        }

        .story-list li:hover {
            background: rgba(255, 107, 53, 0.25);
            transform: translateX(10px) scale(1.03);
            box-shadow: 0 4px 15px var(--border-glow);
        }

        .story-list li.active {
            background: rgba(255, 107, 53, 0.35);
            border-right: 6px solid var(--secondary-color);
            font-weight: bold;
            box-shadow: 0 4px 20px var(--border-glow);
        }

        .content-area {
            padding: 40px;
            overflow-y: auto;
        }

        .ad-container {
            max-width: 800px;
            margin: 0 auto 30px;
            padding: 20px;
            background: rgba(45, 27, 78, 0.4);
            border-radius: 15px;
            border: 2px solid rgba(255, 107, 53, 0.2);
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .story-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(45, 27, 78, 0.7);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 25px;
            border: 2px solid var(--border-glow);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 40px var(--border-glow);
        }

        .story { display: none; }
        .story.active { display: block; animation: fadeInUp 0.6s ease; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .story-title {
            font-size: 40px;
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 35px;
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.6), 0 0 40px rgba(255, 107, 53, 0.3);
        }

        .story-controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .story-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 17px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--border-glow);
        }

        .story-btn:hover:not(:disabled) {
            transform: translateY(-4px) scale(1.08);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.6);
        }

        .story-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .voice-status {
            text-align: center;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            background: rgba(255, 107, 53, 0.2);
            border: 2px solid var(--border-glow);
            transition: all 0.3s ease;
        }

        .voice-status.active { animation: statusPulse 1.5s ease-in-out infinite; }

        @keyframes statusPulse {
            0%, 100% { box-shadow: 0 0 10px var(--border-glow); }
            50% { box-shadow: 0 0 25px rgba(255, 107, 53, 0.8); }
        }

        .story-text {
            line-height: 2.3;
            font-size: 19px;
            text-align: justify;
            color: var(--light-text);
        }

        .story-text p {
            margin-bottom: 20px;
            text-indent: 30px;
        }

        .progress-container {
            background: rgba(255, 255, 255, 0.1);
            height: 12px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 107, 53, 0.3);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            width: 0;
            transition: width 0.5s ease;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.7);
        }

        .story-navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 15px;
        }

        .nav-btn {
            background: rgba(255, 107, 53, 0.2);
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
            flex: 1;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--primary-color);
            color: white;
            transform: scale(1.05);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .main-layout { grid-template-columns: 1fr; }
            .content-area { padding: 20px 15px; }
            .story-container { padding: 30px 20px; }
            header { grid-template-columns: 1fr; padding: 15px; }
            header h1 { font-size: 26px; }
            .user-profile { display: none; }
            .header-icon { display: none; }
            .menu-toggle { display: block; }
            .sidebar {
                position: fixed;
                top: 0;
                right: 0;
                height: 100vh;
                width: 85%;
                max-width: 350px;
                transform: translateX(100%);
                transition: transform 0.3s ease;
                z-index: 1000;
            }
            .sidebar.active { transform: translateX(0); }
            .story-title { font-size: 28px; }
            .story-text { font-size: 17px; line-height: 2.1; }
            .story-controls { flex-direction: column; gap: 12px; }
            .story-btn { width: 100%; padding: 16px; }
            .story-navigation { flex-direction: column; }
            .login-container { padding: 40px 30px; }
            .login-container h1 { font-size: 38px; }
        }
    </style>
</head>

    <script>
        let currentUser = null;
        let currentStory = 0;
        let isReading = false;
        let utterance = null;
        let voices = [];

        const stories = [
            {id: 0, title: '🎃 الساعة الملعونة', text: 'في إحدى الليالي الباردة، اشترى محمد ساعة حائطية قديمة من متجر العتيقات. كانت الساعة جميلة بتصميمها العتيق، لكنها غريبة بطريقة ما. في الليلة الأولى، لاحظ محمد شيئاً غريباً. الساعة تتحرك بسرعة أسرع من المعتاد. عندما أصبحت الساعة الثالثة والثلاثين دقيقة صباحاً، سمع صوت خطوات غريبة في الممر. من هناك؟ صرخ محمد، لكن لا أحد رد عليه. في كل ليلة، عندما تصل الساعة إلى نفس الوقت، يسمع محمد نفس الأصوات المرعبة. وفي كل مرة، يشعر بوجود شيء بارد يقترب منه في الظلام. بعد أسبوع، اكتشف محمد الحقيقة المرعبة. السعر الذي دفعه للساعة كان نفس سعر حياة سابقة. والآن، الساعة تأخذ حياته، ثانية واحدة في كل مرة تدق فيها.'},
            {id: 1, title: '👻 الفندق الخالي', text: 'حجزت سارة غرفة في فندق قديم بعيد عن المدينة. عندما وصلت، وجدت الفندق خالياً تماماً. لا موظفين، لا نزلاء آخرين. صعدت إلى غرفتها في الطابق الخامس. الممر كان طويلاً وهادئاً بشكل غريب. في منتصف الليل، سمعت سارة أصوات خطوات في الممر. فتحت الباب ببطء، لكن لم يكن هناك أحد. في الصباح، اكتشفت سارة أن الفندق مغلق منذ ثلاثين سنة بعد حادثة غريبة. والآن، هي جزء من تلك الليلة الملعونة.'},
            {id: 2, title: '🌲 الغابة المظلمة', text: 'ذهب أحمد ورفاقه في رحلة تخييم إلى غابة بعيدة. في الليل، شعروا بأن شيئاً ما يراقبهم من الظلام. ظهرت ظلال غريبة حول النار. حاول الجميع الهروب، لكن الغابة التفت عليهم. لم ينجُ أحمد ورفاقه من الغابة. وإلى اليوم، الناس يسمعون أصوات تنادي من داخل الغابة.'}
        ];

        function initiateGoogleSignIn() {
            // تهيئة Google Sign-In
            if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
                try {
                    google.accounts.id.initialize({
                        client_id: '295699802302-t4l7rov5vo93g20fuphhbh4sj21dbgu1.apps.googleusercontent.com',
                        callback: handleCredentialResponse,
                        auto_select: false,
                        cancel_on_tap_outside: true
                    });
                    
                    google.accounts.id.prompt((notification) => {
                        if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                            // إذا لم يظهر popup، نستخدم renderButton
                            const buttonDiv = document.createElement('div');
                            buttonDiv.id = 'g_id_signin';
                            document.body.appendChild(buttonDiv);
                            
                            google.accounts.id.renderButton(
                                buttonDiv,
                                { 
                                    theme: 'filled_blue',
                                    size: 'large',
                                    text: 'signin_with',
                                    locale: 'ar'
                                }
                            );
                            
                            buttonDiv.querySelector('div[role="button"]').click();
                        }
                    });
                } catch (error) {
                    console.error('خطأ في تسجيل الدخول:', error);
                    alert('⚠️ تنبيه:\n\n1. تأكد من رفع الموقع على HTTPS (Google Sign-In لا يعمل على HTTP)\n2. تأكد من إضافة رابط موقعك في Google Cloud Console\n\nالخطأ: ' + error.message);
                }
            } else {
                alert('⏳ جاري تحميل Google Sign-In...\n\nيرجى الانتظار ثانية ثم المحاولة مرة أخرى.');
                
                // إعادة تحميل السكريبت
                setTimeout(() => {
                    const script = document.createElement('script');
                    script.src = 'https://accounts.google.com/gsi/client';
                    script.async = true;
                    script.defer = true;
                    document.head.appendChild(script);
                }, 1000);
            }
        }

        function handleCredentialResponse(response) {
            if (!response || !response.credential) {
                alert('فشل تسجيل الدخول. يرجى المحاولة مرة أخرى.');
                return;
            }

            try {
                const responsePayload = decodeJwtResponse(response.credential);
                
                if (!responsePayload || !responsePayload.sub || !responsePayload.email) {
                    throw new Error('بيانات غير صحيحة');
                }

                currentUser = {
                    id: responsePayload.sub,
                    name: responsePayload.name || 'مستخدم',
                    email: responsePayload.email,
                    picture: responsePayload.picture || ''
                };

                try {
                    localStorage.setItem('user', JSON.stringify(currentUser));
                } catch (storageError) {
                    console.warn('تعذر حفظ البيانات:', storageError);
                }

                displayUser(currentUser);
                showMainContent();
            } catch (error) {
                console.error('خطأ في معالجة تسجيل الدخول:', error);
                alert('حدث خطأ أثناء تسجيل الدخول');
            }
        }

        function decodeJwtResponse(token) {
            try {
                const base64Url = token.split('.')[1];
                if (!base64Url) throw new Error('رمز غير صالح');
                
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(
                    atob(base64)
                        .split('')
                        .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
                        .join('')
                );
                
                return JSON.parse(jsonPayload);
            } catch (error) {
                console.error('خطأ في فك التشفير:', error);
                throw new Error('فشل فك تشفير البيانات');
            }
        }

        function displayUser(user) {
            const userImage = document.getElementById('userImage');
            const userName = document.getElementById('userName');
            const userEmail = document.getElementById('userEmail');

            if (userImage && user.picture) {
                userImage.src = user.picture;
                userImage.onerror = () => {
                    userImage.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50"><circle cx="25" cy="25" r="25" fill="%23ff6b35"/></svg>';
                };
            }
            if (userName) userName.textContent = user.name || 'مستخدم';
            if (userEmail) userEmail.textContent = user.email || '';
        }

        function buildStories() {
            const storyList = document.getElementById('storyList');
            const storiesContainer = document.getElementById('storiesContainer');

            if (!storyList || !storiesContainer) return;

            stories.forEach((story, index) => {
                const li = document.createElement('li');
                li.dataset.story = index;
                li.textContent = story.title;
                li.setAttribute('role', 'button');
                li.setAttribute('tabindex', '0');
                if (index === 0) li.classList.add('active');
                
                li.addEventListener('click', () => {
                    selectStory(index);
                    if (window.innerWidth <= 768) closeSidebar();
                });

                li.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        selectStory(index);
                        if (window.innerWidth <= 768) closeSidebar();
                    }
                });

                storyList.appendChild(li);

                const storyDiv = document.createElement('div');
                storyDiv.className = 'story' + (index === 0 ? ' active' : '');
                storyDiv.id = `story-${index}`;
                storyDiv.innerHTML = `
                    <h2 class="story-title">${story.title}</h2>
                    <div class="story-controls">
                        <button class="story-btn" id="playBtn-${index}" onclick="readStory(${index})">🔊 قراءة القصة</button>
                        <button class="story-btn" id="stopBtn-${index}" onclick="stopReading()">⏹️ توقف</button>
                    </div>
                    <div class="voice-status" id="status-${index}">🎃 جاهز للقراءة</div>
                    <div class="story-text">${story.text.split('. ').filter(p => p.trim()).map(p => `<p>${p}.</p>`).join('')}</div>
                    <div class="story-navigation">
                        <button class="nav-btn" onclick="previousStory()" ${index === 0 ? 'disabled' : ''}>⬅️ القصة السابقة</button>
                        <button class="nav-btn" onclick="nextStory()" ${index === stories.length - 1 ? 'disabled' : ''}>القصة التالية ➡️</button>
                    </div>
                `;
                storiesContainer.appendChild(storyDiv);
            });
            
            loadVoices();
        }

        function selectStory(index) {
            if (index < 0 || index >= stories.length) return;

            document.querySelectorAll('.story').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.story-list li').forEach(l => l.classList.remove('active'));
            
            const storyEl = document.getElementById(`story-${index}`);
            const listItem = document.querySelector(`[data-story="${index}"]`);
            
            if (storyEl) storyEl.classList.add('active');
            if (listItem) listItem.classList.add('active');
            
            currentStory = index;
            updateProgressBar();
            saveProgress();
            stopReading();
            
            const contentArea = document.querySelector('.content-area');
            if (contentArea) contentArea.scrollTop = 0;
        }

        function nextStory() {
            if (currentStory < stories.length - 1) selectStory(currentStory + 1);
        }

        function previousStory() {
            if (currentStory > 0) selectStory(currentStory - 1);
        }

        function loadVoices() {
            if ('speechSynthesis' in window) {
                voices = speechSynthesis.getVoices();
                speechSynthesis.onvoiceschanged = () => {
                    voices = speechSynthesis.getVoices();
                };
            }
        }

        function readStory(index) {
            if (index < 0 || index >= stories.length) return;

            stopReading();
            
            const story = stories[index];
            const statusEl = document.getElementById(`status-${index}`);
            const playBtn = document.getElementById(`playBtn-${index}`);
            
            if (!statusEl || !playBtn) return;

            if (!('speechSynthesis' in window)) {
                statusEl.textContent = '❌ المتصفح لا يدعم القراءة الصوتية';
                return;
            }
            
            isReading = true;
            playBtn.disabled = true;
            statusEl.textContent = '⏳ جاري التحضير...';
            statusEl.classList.add('active');
            
            try {
                utterance = new SpeechSynthesisUtterance(story.text);
                
                const arabicVoice = voices.find(v => v.lang && v.lang.startsWith('ar'));
                if (arabicVoice) utterance.voice = arabicVoice;
                
                utterance.lang = 'ar-SA';
                utterance.rate = 1;
                utterance.volume = 1;
                utterance.pitch = 1;
                
                utterance.onstart = () => {
                    isReading = true;
                    if (statusEl) statusEl.textContent = '👻 جاري القراءة...';
                };
                
                utterance.onend = () => {
                    if (isReading) {
                        isReading = false;
                        if (statusEl) {
                            statusEl.textContent = '✅ انتهت القراءة';
                            statusEl.classList.remove('active');
                        }
                        if (playBtn) playBtn.disabled = false;
                    }
                };
                
                utterance.onerror = (event) => {
                    console.error('خطأ في القراءة:', event);
                    if (statusEl) {
                        statusEl.textContent = '❌ خطأ في القراءة';
                        statusEl.classList.remove('active');
                    }
                    if (playBtn) playBtn.disabled = false;
                    isReading = false;
                };
                
                speechSynthesis.cancel();
                speechSynthesis.speak(utterance);
            } catch (error) {
                console.error('فشل التشغيل:', error);
                if (statusEl) statusEl.textContent = '❌ فشل التشغيل';
                if (playBtn) playBtn.disabled = false;
                isReading = false;
            }
        }

        function stopReading() {
            if (isReading || (speechSynthesis && speechSynthesis.speaking)) {
                try {
                    speechSynthesis.cancel();
                } catch (error) {
                    console.error('خطأ في الإيقاف:', error);
                }
                
                isReading = false;
                
                document.querySelectorAll('.voice-status').forEach(s => {
                    s.textContent = '⏹️ تم الإيقاف';
                    s.classList.remove('active');
                });
                
                document.querySelectorAll('[id^="playBtn-"]').forEach(btn => {
                    btn.disabled = false;
                });
            }
        }

        function updateProgressBar() {
            const progressBar = document.getElementById('progressBar');
            if (progressBar && stories.length > 0) {
                progressBar.style.width = ((currentStory + 1) / stories.length) * 100 + '%';
            }
        }

        function saveProgress() {
            if (currentUser) {
                try {
                    localStorage.setItem('lastStory', currentStory.toString());
                } catch (error) {
                    console.warn('تعذر حفظ التقدم:', error);
                }
            }
        }

        function showMainContent() {
            const loginScreen = document.getElementById('loginScreen');
            const header = document.getElementById('header');
            const mainLayout = document.getElementById('mainLayout');

            if (loginScreen) loginScreen.classList.add('hidden');
            if (header) header.style.display = 'grid';
            if (mainLayout) mainLayout.style.display = 'grid';
            
            buildStories();
            
            try {
                if (window.adsbygoogle) {
                    (adsbygoogle = window.adsbygoogle || []).push({});
                    (adsbygoogle = window.adsbygoogle || []).push({});
                }
            } catch (e) {
                console.warn('لم يتم تحميل الإعلانات:', e);
            }
        }

        function logout() {
            if (confirm('هل أنت متأكد أنك تريد تسجيل الخروج؟')) {
                try {
                    localStorage.removeItem('user');
                    localStorage.removeItem('lastStory');
                } catch (error) {
                    console.warn('خطأ في حذف البيانات:', error);
                }
                
                currentUser = null;
                stopReading();
                location.reload();
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar) sidebar.classList.toggle('active');
            if (overlay) overlay.classList.toggle('active');
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar) sidebar.classList.remove('active');
            if (overlay) overlay.classList.remove('active');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const menuToggle = document.getElementById('menuToggle');
            if (menuToggle) menuToggle.addEventListener('click', toggleSidebar);

            const sidebarOverlay = document.getElementById('sidebarOverlay');
            if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);

            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    nextStory();
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    previousStory();
                } else if (e.key === ' ') {
                    e.preventDefault();
                    if (isReading) stopReading();
                    else readStory(currentStory);
                } else if (e.key === 'Escape') {
                    stopReading();
                    closeSidebar();
                }
            });
        });

        window.addEventListener('load', () => {
            // تهيئة Google Sign-In تلقائياً
            const initGoogleSignIn = () => {
                if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
                    try {
                        google.accounts.id.initialize({
                            client_id: '295699802302-t4l7rov5vo93g20fuphhbh4sj21dbgu1.apps.googleusercontent.com',
                            callback: handleCredentialResponse,
                            auto_select: false
                        });
                        
                        // عرض زر Google الرسمي
                        const signInDiv = document.getElementById('g_id_signin');
                        if (signInDiv) {
                            google.accounts.id.renderButton(
                                signInDiv,
                                { 
                                    theme: 'filled_blue',
                                    size: 'large',
                                    text: 'signin_with',
                                    width: 300,
                                    locale: 'ar'
                                }
                            );
                        }
                    } catch (error) {
                        console.error('خطأ في تهيئة Google Sign-In:', error);
                    }
                } else {
                    // إعادة المحاولة بعد ثانية
                    setTimeout(initGoogleSignIn, 1000);
                }
            };
            
            // بدء التهيئة
            setTimeout(initGoogleSignIn, 500);
            
            // استعادة الجلسة السابقة
            try {
                const savedUser = localStorage.getItem('user');
                if (savedUser) {
                    const parsedUser = JSON.parse(savedUser);
                    if (parsedUser && parsedUser.id && parsedUser.email) {
                        currentUser = parsedUser;
                        displayUser(currentUser);
                        showMainContent();
                    }
                }
            } catch (error) {
                console.error('خطأ في استعادة الجلسة:', error);
                localStorage.removeItem('user');
            }
        });

        window.addEventListener('beforeunload', () => {
            stopReading();
        });

        window.handleCredentialResponse = handleCredentialResponse;
        window.initiateGoogleSignIn = initiateGoogleSignIn;
        window.logout = logout;
        window.readStory = readStory;
        window.stopReading = stopReading;
        window.nextStory = nextStory;
        window.previousStory = previousStory;
    </script>
</body>
</html>
